<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MGuhlin.org - Creations</title>
<link rel="alternate" type="application/rss+xml" title="Creative Works RSS" href="feed.xml">
<style>
:root {
  --page: #f7f9fc;
  --ink: #0b1d33;
  --muted: #4f6072;
  --faint: #6f8092;
  --line: #c8d2dc;
  --soft: #e6ebf1;
  --soft-line: #d8dee6;
  --navy: #102a54;
  --blue: #2f5f8f;
  --steel: #6f8faf;
  --silver: #c8d2dc;
  --white: #fff;
  --max: 1100px;
}

*, *::before, *::after {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  background:
    radial-gradient(circle at top left, rgba(200,210,220,0.45), transparent 34rem),
    linear-gradient(180deg, #fff 0%, var(--page) 42%, #eef2f6 100%);
  color: var(--ink);
  font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

a {
  color: inherit;
  text-decoration-thickness: 1px;
  text-underline-offset: 3px;
}

a:hover {
  text-decoration-thickness: 2px;
}

.site {
  max-width: var(--max);
  margin: 0 auto;
  padding: 34px 24px 48px;
}

.hero {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(220px, 300px);
  gap: 34px;
  align-items: center;
  border-bottom: 1px solid var(--line);
  padding: 18px 0 30px;
}

.hero-copy {
  min-width: 0;
}

.hero-portrait {
  --portrait-size: min(100%, 300px);
  justify-self: end;
  width: var(--portrait-size);
  height: var(--portrait-size);
  border: 1px solid rgba(111,143,175,0.45);
  border-radius: 8px;
  background: linear-gradient(145deg, #fff 0%, #eef3f8 100%);
  box-shadow: 0 18px 45px rgba(11,29,51,0.15);
  object-fit: cover;
}

.eyebrow,
.stat-label,
.result-count,
.section-count,
.item-meta,
.loading-label {
  color: var(--faint);
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 0.72rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.eyebrow {
  margin-bottom: 10px;
  color: var(--blue);
}

.eyebrow a {
  color: inherit;
  text-decoration: none;
}

.eyebrow a:hover {
  text-decoration: underline;
}

h1 {
  margin: 0;
  font-size: clamp(2.1rem, 6vw, 4.2rem);
  letter-spacing: 0;
  line-height: 1;
  color: var(--navy);
}

.byline {
  margin: 12px 0 0;
  font-size: 1.05rem;
  font-weight: 700;
}

.description {
  max-width: 720px;
  margin: 10px 0 0;
  color: var(--muted);
  font-size: 1rem;
}

.hero-row {
  display: flex;
  flex-wrap: wrap;
  gap: 22px;
  align-items: flex-end;
  margin-top: 22px;
}

.primary-link {
  display: inline-flex;
  align-items: center;
  min-height: 38px;
  padding: 8px 13px;
  background: var(--navy);
  border: 1px solid var(--navy);
  border-radius: 4px;
  color: #fff;
  font-size: 0.9rem;
  text-decoration: none;
}

.primary-link:hover {
  background: var(--blue);
  border-color: var(--blue);
}

.feed-link {
  display: inline-flex;
  gap: 7px;
  align-items: center;
  min-height: 38px;
  padding: 8px 12px;
  border: 1px solid var(--silver);
  border-radius: 4px;
  color: var(--navy);
  font-size: 0.9rem;
  text-decoration: none;
}

.feed-link:hover {
  border-color: var(--blue);
  background: var(--soft);
}

.feed-link svg {
  width: 16px;
  height: 16px;
  fill: currentColor;
  flex: 0 0 auto;
}

.stats {
  display: flex;
  flex-wrap: wrap;
  gap: 20px;
}

.stat {
  min-width: 54px;
}

.stat-num {
  display: block;
  font-size: 1.35rem;
  font-weight: 800;
  line-height: 1;
  color: var(--navy);
}

.stat-label {
  display: block;
  margin-top: 4px;
}

.tools {
  position: sticky;
  top: 0;
  z-index: 10;
  margin: 0 -24px;
  padding: 16px 24px;
  background: rgba(247,249,252,0.94);
  border-bottom: 1px solid var(--line);
  backdrop-filter: blur(10px);
}

.search-row {
  display: grid;
  grid-template-columns: minmax(220px, 1fr) auto;
  gap: 12px;
  align-items: center;
}

.search-wrap {
  position: relative;
}

.search-wrap::before {
  content: "#";
  position: absolute;
  top: 50%;
  left: 12px;
  color: var(--faint);
  transform: translateY(-50%);
}

#search-input {
  width: 100%;
  min-height: 40px;
  padding: 9px 40px 9px 32px;
  border: 1px solid var(--silver);
  border-radius: 4px;
  color: var(--ink);
  font: inherit;
}

#search-input:focus {
  outline: none;
  border-color: var(--blue);
  box-shadow: 0 0 0 3px rgba(47,95,143,0.14);
}

.search-clear {
  position: absolute;
  top: 50%;
  right: 8px;
  display: none;
  width: 26px;
  height: 26px;
  border: 0;
  border-radius: 4px;
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  font-size: 1.1rem;
  transform: translateY(-50%);
}

.search-clear.visible {
  display: inline-flex;
  align-items: center;
  justify-content: center;
}

.search-clear:hover {
  background: var(--soft);
  color: var(--navy);
}

.quick-links {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  margin-top: 12px;
}

.quick-links a {
  display: inline-flex;
  align-items: center;
  min-height: 30px;
  padding: 5px 9px;
  border: 1px solid var(--line);
  border-radius: 4px;
  background: #fff;
  color: var(--navy);
  font-size: 0.82rem;
  text-decoration: none;
}

.quick-links a:hover {
  border-color: var(--blue);
  background: #eef3f8;
}

.content {
  padding-top: 22px;
}

.section-block {
  scroll-margin-top: 130px;
  padding: 18px 0 22px;
  border-bottom: 1px solid var(--soft-line);
}

.section-block.hidden {
  display: none;
}

.section-header {
  display: flex;
  gap: 12px;
  align-items: baseline;
  justify-content: space-between;
  margin-bottom: 8px;
}

.section-title {
  margin: 0;
  font-size: 1.05rem;
  color: var(--navy);
}

.section-description {
  max-width: 720px;
  margin: -2px 0 10px;
  color: var(--muted);
  font-size: 0.92rem;
}

.project-list {
  margin: 0;
  padding: 0;
  list-style: none;
}

.project-item {
  margin: 0;
  padding: 9px 12px;
  border-radius: 4px;
}

.project-item.is-even {
  background: rgba(230,235,241,0.72);
}

.project-item.is-odd {
  background: #fff;
}

.project-item.hidden {
  display: none;
}

.project-line {
  display: grid;
  grid-template-columns: 10px minmax(170px, 240px) 1fr auto;
  gap: 12px;
  align-items: baseline;
}

.project-line::before {
  content: "\2022";
  color: var(--blue);
  font-weight: 700;
}

.project-title {
  font-weight: 700;
}

.project-summary {
  color: var(--muted);
}

.item-meta {
  white-space: nowrap;
}

.item-meta a {
  color: var(--muted);
  text-decoration: none;
}

.item-meta a:hover {
  color: var(--blue);
  text-decoration: underline;
}

.empty-state {
  display: none;
  padding: 42px 0;
  color: var(--muted);
}

.empty-state.visible {
  display: block;
}

.footer {
  display: flex;
  flex-wrap: wrap;
  gap: 12px 18px;
  justify-content: space-between;
  padding-top: 26px;
  color: var(--muted);
  font-size: 0.88rem;
}

.footer-links {
  display: flex;
  flex-wrap: wrap;
  gap: 14px;
}

#loading {
  position: fixed;
  inset: 0;
  z-index: 20;
  display: flex;
  flex-direction: column;
  gap: 10px;
  align-items: center;
  justify-content: center;
  background: #f7f9fc;
  transition: opacity 0.2s;
}

#loading.hidden {
  opacity: 0;
  pointer-events: none;
}

.loading-mark {
  width: 22px;
  height: 22px;
  border: 2px solid var(--silver);
  border-top-color: var(--blue);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

.top-link {
  position: fixed;
  right: 20px;
  bottom: 20px;
  display: none;
  width: 38px;
  height: 38px;
  align-items: center;
  justify-content: center;
  border: 1px solid var(--navy);
  border-radius: 4px;
  background: var(--navy);
  color: #fff;
  text-decoration: none;
}

.top-link.visible {
  display: inline-flex;
}

@media (max-width: 720px) {
  .site {
    padding: 24px 16px 40px;
  }

  .tools {
    margin: 0 -16px;
    padding: 14px 16px;
  }

  .search-row,
  .project-line {
    grid-template-columns: 1fr;
    gap: 5px;
  }

  .result-count,
  .item-meta {
    white-space: normal;
  }

  .hero-row {
    align-items: flex-start;
    flex-direction: column;
  }

  .hero {
    grid-template-columns: 1fr;
    gap: 20px;
  }

  .hero-portrait {
    --portrait-size: min(220px, 72vw);
    justify-self: start;
  }

  .stats {
    gap: 18px;
  }
}
</style>
</head>
<body>
<div id="loading">
  <div class="loading-mark" aria-hidden="true"></div>
  <div class="loading-label">Loading projects</div>
</div>

<div class="site">
  <header class="hero" id="top">
    <div class="hero-copy">
      <div class="eyebrow"><a href="https://mguhlin.org" target="_blank" rel="noopener">MGuhlin.org</a> - Digital Creations</div>
      <h1>Creative Works</h1>
      <p class="byline" id="hero-byline"></p>
      <p class="description" id="hero-desc"></p>
      <div class="hero-row">
        <a class="primary-link" href="https://go.mgpd.org/aic" target="_blank" rel="noopener">go.mgpd.org/aic</a>
        <a class="feed-link" href="feed.xml" type="application/rss+xml" aria-label="Creative Works RSS feed">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M6.18 17.82a2.18 2.18 0 1 1-4.36 0 2.18 2.18 0 0 1 4.36 0ZM2 8.72v3.09c5.62 0 10.19 4.57 10.19 10.19h3.09C15.28 14.67 9.33 8.72 2 8.72ZM2 2v3.09c9.32 0 16.91 7.59 16.91 16.91H22C22 10.97 13.03 2 2 2Z"/>
          </svg>
          RSS
        </a>
        <div class="stats" id="hero-tally" aria-label="Project statistics"></div>
      </div>
    </div>
    <img class="hero-portrait" src="https://mguhlin.org/miguel.png" alt="Portrait of Miguel Guhlin" width="512" height="512">
  </header>

  <section class="tools" aria-label="Find projects">
    <div class="search-row">
      <div class="search-wrap">
        <input type="search" id="search-input" placeholder="Search projects, sections, and descriptions" autocomplete="off">
        <button class="search-clear" id="search-clear" aria-label="Clear search">x</button>
      </div>
      <div class="result-count" id="result-count"></div>
    </div>
    <nav class="quick-links" id="quick-links" aria-label="Section quick links"></nav>
  </section>

  <main class="content" id="project-sections"></main>

  <div class="empty-state" id="empty-state">
    <strong>No projects match.</strong>
    <span> Try a different search term.</span>
  </div>

  <footer class="footer" id="site-footer"></footer>
</div>

<a href="#top" class="top-link" id="back-to-top" aria-label="Back to top">^</a>

<script>
let ALL_PROJECTS = [];
let activeSearch = '';

const DISPLAY_GROUPS = [
  {
    name: 'AI Tools & Prompt Libraries',
    description: 'Prompt builders, custom instructions, AI literacy resources, and ready-to-use assistant libraries.'
  },
  {
    name: 'Teaching Strategies & Professional Learning',
    description: 'Coaching tools, strategy guides, reflection activities, course resources, and educator growth supports.'
  },
  {
    name: 'Classroom Activities & Generators',
    description: 'Student-facing games, randomizers, puzzles, breakouts, warm-ups, and quick classroom makers.'
  },
  {
    name: 'Data, Dashboards & Evaluation',
    description: 'Dashboards, rubrics, scoring tools, data displays, visualizations, and evidence-based decision aids.'
  },
  {
    name: 'Library & Research Tools',
    description: 'Library programming tools, reading activities, source evaluation, citations, catalog practice, and research skills.'
  },
  {
    name: 'Leadership, Policy & Planning',
    description: 'Planning frameworks, policy guides, technology integration resources, adoption roadmaps, and operational tools.'
  },
  {
    name: 'Productivity, Utilities & Workflows',
    description: 'Reusable work tools, search portals, media scripts, onboarding generators, and workflow helpers.'
  },
  {
    name: 'Conference & Workshop Materials',
    description: 'Session hubs, slide decks, web decks, training materials, and workshop-ready resources.'
  }
];

async function loadAndRender() {
  let data;
  try {
    const res = await fetch('projects.json?v=' + Date.now());
    if (!res.ok) throw new Error('fetch failed');
    data = await res.json();
  } catch (error) {
    document.getElementById('loading').innerHTML =
      '<p style="color:#555;font-family:ui-monospace,monospace;font-size:.82rem;">Could not load projects.json next to index.html.</p>';
    return;
  }

  ALL_PROJECTS = data.projects || [];
  buildHero(data.meta || {});
  buildQuickLinks(ALL_PROJECTS);
  buildSections(ALL_PROJECTS);
  buildFooter(data.meta || {});
  bindControls();
  updateResultCount(ALL_PROJECTS.length);

  const loader = document.getElementById('loading');
  loader.classList.add('hidden');
  setTimeout(() => loader.remove(), 250);

  const backToTop = document.getElementById('back-to-top');
  window.addEventListener('scroll', () => {
    backToTop.classList.toggle('visible', window.scrollY > 500);
  }, { passive: true });
}

function buildHero(meta) {
  document.getElementById('hero-byline').textContent = meta.byline || '';
  document.getElementById('hero-desc').textContent = meta.description || '';

  const tallyEl = document.getElementById('hero-tally');
  tallyEl.innerHTML = '';
  (meta.tallies || []).forEach(tally => {
    tallyEl.insertAdjacentHTML('beforeend', `
      <div class="stat">
        <span class="stat-num">${escapeHtml(tally.num)}</span>
        <span class="stat-label">${escapeHtml(tally.label)}</span>
      </div>`);
  });
}

function buildQuickLinks(projects) {
  const nav = document.getElementById('quick-links');
  nav.innerHTML = '';
  getDisplayGroups(projects).forEach(group => {
    const count = projects.filter(project => displayGroupFor(project) === group.name).length;
    nav.insertAdjacentHTML('beforeend',
      `<a href="#${sectionId(group.name)}">${escapeHtml(group.name)} ${count}</a>`);
  });
}

function buildSections(projects) {
  const main = document.getElementById('project-sections');
  main.innerHTML = '';

  getDisplayGroups(projects).forEach(group => {
    const projectsInSection = projects
      .filter(project => displayGroupFor(project) === group.name)
      .sort(compareProjectsByTitle);
    const block = document.createElement('section');
    block.className = 'section-block';
    block.id = sectionId(group.name);
    block.dataset.section = group.name;

    block.innerHTML = `
      <div class="section-header">
        <h2 class="section-title">${escapeHtml(group.name)}</h2>
        <span class="section-count">${projectsInSection.length} ${projectsInSection.length === 1 ? 'project' : 'projects'}</span>
      </div>
      <p class="section-description">${escapeHtml(group.description)}</p>
      <ul class="project-list"></ul>`;

    const list = block.querySelector('.project-list');
    projectsInSection.forEach((project, index) => list.appendChild(buildProjectItem(project, index)));
    main.appendChild(block);
  });
}

function buildProjectItem(project, index = 0) {
  const item = document.createElement('li');
  item.className = `project-item ${index % 2 ? 'is-even' : 'is-odd'}`;
  item.id = project.id;
  item.dataset.section = displayGroupFor(project);
  item.dataset.search = [
    project.title,
    project.subtitle,
    project.description,
    project.category,
    project.section,
    displayGroupFor(project),
    ...(project.features || [])
  ].join(' ').toLowerCase();

  const primary = (project.links || []).find(link => link.primary) || (project.links || [])[0];
  const href = primary ? primary.href : `#${project.id}`;
  const target = primary && primary.external ? ' target="_blank" rel="noopener"' : '';
  const title = displayTitleFor(project);
  const summary = oneLine(displaySummaryFor(project));

  item.innerHTML = `
    <div class="project-line">
      <a class="project-title" href="${escapeAttr(href)}"${target}>${escapeHtml(title)}</a>
      <span class="project-summary">${escapeHtml(summary)}</span>
      <span class="item-meta"><a href="#${escapeAttr(project.id)}">#${escapeHtml(project.num || '')}</a></span>
    </div>`;

  return item;
}

function bindControls() {
  const input = document.getElementById('search-input');
  const clear = document.getElementById('search-clear');

  input.addEventListener('input', () => {
    activeSearch = input.value.trim().toLowerCase();
    clear.classList.toggle('visible', activeSearch.length > 0);
    applySearch();
  });

  clear.addEventListener('click', () => {
    input.value = '';
    activeSearch = '';
    clear.classList.remove('visible');
    applySearch();
    input.focus();
  });

  input.addEventListener('keydown', event => {
    if (event.key === 'Escape') clear.click();
  });
}

function applySearch() {
  let visible = 0;
  const hasSearch = activeSearch.length > 0;

  document.querySelectorAll('.section-block').forEach(section => {
    let sectionHasVisible = false;

    section.querySelectorAll('.project-item').forEach(item => {
      const show = !hasSearch || item.dataset.search.includes(activeSearch);
      item.classList.toggle('hidden', !show);
      if (show) {
        sectionHasVisible = true;
        visible += 1;
      }
    });

    refreshRowStripes(section);
    section.classList.toggle('hidden', !sectionHasVisible);
  });

  document.getElementById('empty-state').classList.toggle('visible', visible === 0);
  updateResultCount(visible);
}

function refreshRowStripes(section) {
  let row = 0;
  section.querySelectorAll('.project-item').forEach(item => {
    if (item.classList.contains('hidden')) return;
    item.classList.toggle('is-odd', row % 2 === 0);
    item.classList.toggle('is-even', row % 2 === 1);
    row += 1;
  });
}

function updateResultCount(visible) {
  document.getElementById('result-count').textContent = `${visible} of ${ALL_PROJECTS.length}`;
}

function buildFooter(meta) {
  const links = (meta.footerLinks || [])
    .map(link => `<a href="${escapeAttr(link.href)}" target="_blank" rel="noopener">${escapeHtml(link.label)}</a>`)
    .join('');

  document.getElementById('site-footer').innerHTML = `
    <span>MGuhlin.org - Creations</span>
    <nav class="footer-links" aria-label="Footer links">${links}</nav>
    <span>CC0 1.0 Universal</span>`;
}

function getSections(projects) {
  return [...new Set(projects.map(project => project.section))];
}

function displayTitleFor(project) {
  return stripTags(project.title || '')
    .replace(/^TCEA\s+/i, '')
    .replace(/\s+[-—]\s+TCEA$/i, '')
    .replace(/\s+\|\s+TCEA\s+WebDeck$/i, ' WebDeck')
    .replace(/\s+TCEA\s+resource$/i, '')
    .trim();
}

function compareProjectsByTitle(a, b) {
  return displayTitleFor(a).localeCompare(displayTitleFor(b), undefined, {
    numeric: true,
    sensitivity: 'base'
  });
}

function displaySummaryFor(project) {
  const options = [project.subtitle, project.description, project.category];
  for (const option of options) {
    const summary = cleanSummary(option || '', project);
    if (summary) return summary;
  }
  return stripTags(project.category || '');
}

function cleanSummary(value, project) {
  const title = displayTitleFor(project).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const href = (((project.links || [])[0] || {}).href || '').replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

  return stripTags(value)
    .replace(/\s*TCEA resource\s*/gi, ' ')
    .replace(/\s*Added to the creations index so it can be found through search and section navigation\.?/gi, ' ')
    .replace(href ? new RegExp(`\\s*available at\\s+${href}\\.?`, 'gi') : /$^/, ' ')
    .replace(title ? new RegExp(`^${title}\\s+`, 'i') : /$^/, '')
    .replace(/\s+/g, ' ')
    .trim();
}

function getDisplayGroups(projects) {
  const active = new Set(projects.map(project => displayGroupFor(project)));
  return DISPLAY_GROUPS.filter(group => active.has(group.name));
}

function displayGroupFor(project) {
  const section = stripTags(project.section || '').toLowerCase();
  const category = stripTags(project.category || '').toLowerCase();
  const title = stripTags(project.title || '').toLowerCase();
  const href = ((project.links || [])[0] || {}).href || '';
  const haystack = [section, category, title, href.toLowerCase()].join(' ');

  if (haystack.includes('libvibes') || href.includes('/vcl/') || href.includes('/vcll/')) {
    return 'Library & Research Tools';
  }

  if (
    haystack.includes('dashboard') ||
    haystack.includes('data') ||
    haystack.includes('visual') ||
    haystack.includes('rubric') ||
    haystack.includes('assessment system') ||
    haystack.includes('scoring') ||
    haystack.includes('evaluation')
  ) {
    return 'Data, Dashboards & Evaluation';
  }

  if (
    haystack.includes('classroom') ||
    haystack.includes('interactive') ||
    haystack.includes('breakout') ||
    haystack.includes('game') ||
    haystack.includes('puzzle') ||
    haystack.includes('spinner') ||
    haystack.includes('dice') ||
    haystack.includes('bingo') ||
    haystack.includes('wheel') ||
    haystack.includes('word search') ||
    haystack.includes('activity') ||
    haystack.includes('flashcards')
  ) {
    return 'Classroom Activities & Generators';
  }

  if (
    haystack.includes('professional') ||
    haystack.includes('coaching') ||
    haystack.includes('coach') ||
    haystack.includes('course') ||
    haystack.includes('reflection') ||
    haystack.includes('strategy') ||
    haystack.includes('visible learning') ||
    haystack.includes('instructional')
  ) {
    return 'Teaching Strategies & Professional Learning';
  }

  if (
    haystack.includes('ai') ||
    haystack.includes('prompt') ||
    haystack.includes('claude') ||
    haystack.includes('boodlebox') ||
    haystack.includes('custom instructions') ||
    haystack.includes('protect') ||
    haystack.includes('vibe coding')
  ) {
    return 'AI Tools & Prompt Libraries';
  }

  if (
    haystack.includes('policy') ||
    haystack.includes('leadership') ||
    haystack.includes('roadmap') ||
    haystack.includes('planning') ||
    haystack.includes('technology integration') ||
    haystack.includes('edtech framework') ||
    haystack.includes('vendor') ||
    haystack.includes('privacy') ||
    haystack.includes('intake') ||
    haystack.includes('organizer')
  ) {
    return 'Leadership, Policy & Planning';
  }

  if (
    haystack.includes('conference') ||
    haystack.includes('session') ||
    haystack.includes('workshop') ||
    haystack.includes('webdeck') ||
    haystack.includes('slide deck') ||
    haystack.includes('training') ||
    haystack.includes('lunch')
  ) {
    return 'Conference & Workshop Materials';
  }

  return 'Productivity, Utilities & Workflows';
}

function sectionId(section) {
  return 'section-' + stripTags(section || '')
    .toLowerCase()
    .replace(/&amp;/g, 'and')
    .replace(/[^a-z0-9]+/g, '-')
    .replace(/^-|-$/g, '');
}

function oneLine(value) {
  const clean = stripTags(value).replace(/\s+/g, ' ').trim();
  if (clean.length <= 118) return clean;
  return clean.slice(0, 115).trim() + '...';
}

function stripTags(value) {
  return String(value || '').replace(/<[^>]*>/g, '').replace(/&amp;/g, '&');
}

function escapeHtml(value) {
  return String(value || '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function escapeAttr(value) {
  return escapeHtml(value).replace(/`/g, '&#96;');
}
