<style>
  :root{--c1:#7c5cbf;--c2:#1aa3b8;--c3:#46a23c;--c4:#f08a16;--c5:#2f6fe0;--navy:#102a54;--gold-d:#c97f12;

  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Nunito',sans-serif;color:var(--ink);background:

  .crumb{font-size:.82rem;font-weight:700;margin-bottom:12px}.crumb a{color:var(--c5);text-decoration:none}

  .langbar button{font-family:'Fredoka',sans-serif;font-weight:600;font-size:.8rem;border:2px solid var(--line);background:#fff;color:var(--ink-soft);border-radius:100px;padding:6px 13px;cursor:pointer;transition:.15s}

  .langbar button.active{background:var(--navy);color:#fff;border-color:var(--navy)}
  .legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:16px 18px;margin:8px 0 10px}
  .legend .title{grid-column:1/-1;font-family:'Fredoka',sans-serif;font-weight:600;color:var(--navy);font-size:1.05rem}
  .leg{display:flex;gap:10px;align-items:center}
  .leg b{color:var(--navy);font-family:'Fredoka',sans-serif}
  .legq{display:block;font-size:.8rem;color:var(--ink-soft);font-weight:600}
  .cchip{display:inline-flex;align-items:center;justify-content:center;color:#fff;font-family:'Fredoka',sans-serif;font-weight:700;width:22px;height:22px;border-radius:6px;font-size:.8rem;margin-right:3px}
  [dir=rtl] .cchip{margin-right:0;margin-left:3px}
  .cchip.big{width:34px;height:34px;font-size:1.1rem;flex-shrink:0}
  .cchip.primary{outline:2px solid var(--navy);outline-offset:1px}
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:8px 0 18px}
  .toolbar .lbl{font-family:'Fredoka',sans-serif;font-weight:600;color:var(--navy);font-size:.85rem}
  .toolbar button,.filterbtn{font-family:'Fredoka',sans-serif;font-weight:600;font-size:.85rem;border:2px solid var(--line);background:#fff;color:var(--ink-soft);border-radius:100px;padding:7px 14px;cursor:pointer}
  .toolbar button:hover,.filterbtn:hover{border-color:var(--gold-d);color:var(--navy)}
  .filterbtn.active{background:var(--navy);color:#fff;border-color:var(--navy)}
  .printbtn{margin-inline-start:auto}
  h2{font-family:'Fredoka',sans-serif;color:var(--navy);font-size:1.3rem;margin:26px 0 8px;border-inline-start:5px solid var(--gold-d);padding-inline-start:12px}
  .tablewrap{overflow-x:auto;border:2px solid var(--line);border-radius:14px;background:var(--card)}
  table{width:100%;border-collapse:collapse;font-size:.88rem;min-width:820px}
  th,td{padding:9px 11px;text-align:start;vertical-align:top;border-bottom:1px solid var(--line)}
  th{background:#f0f3fa;color:var(--navy);font-family:'Fredoka',sans-serif;font-weight:600}
  tr:last-child td{border-bottom:none}
  td.act a{color:var(--navy);font-weight:800;text-decoration:none}
  td.act a:hover{color:var(--c5)}
  .orig{display:inline-block;font-size:.64rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;background:#fff2d9;color:var(--gold-d);border-radius:100px;padding:1px 7px;margin-inline-start:4px;vertical-align:middle}
  .subj{display:inline-block;color:#fff;font-family:'Fredoka',sans-serif;font-weight:600;font-size:.68rem;padding:3px 9px;border-radius:100px;white-space:nowrap}
  td.teks{color:var(--ink-soft);font-weight:600;font-size:.8rem;max-width:220px}
  td.skill{color:var(--ink-soft);font-weight:600;font-size:.82rem;max-width:180px}
  td.clear{white-space:nowrap}
  td.conn{color:var(--ink);font-weight:600;font-size:.83rem;min-width:240px}
  footer{text-align:center;margin-top:34px;font-size:.8rem;color:var(--ink-soft);font-weight:600}
  @media print{
    body{background:#fff}.toolbar,.crumb,.langbar{display:none}
    .tablewrap{overflow:visible;border:none}table{min-width:0;font-size:8.5pt}
    h2{break-after:avoid}tr{break-inside:avoid}.legend{break-inside:avoid}
  }
</style>

, gather supporting details as evidence and spot the useless clue (E), and separate the main idea from mere details (A).","g35-ela-factopinion":"Students test each statement as a checkable fact versus opinion (C), notice signal words and personal bias (L), and keep only verifiable evidence, dropping the useless card (E).","g35-ela-sequence":"Students order plot events using proof words and reject a useless card (E), consider which order actually fits (A), and reassemble the recipe to unlock the kitchen (R).","g35-ela-context":"Students infer a word meaning as a testable claim (C), collect surrounding context clues as proof (E), and choose among possible synonyms/meanings (A).","g35-ss-mapskills":"Lock 5 (Trust the Map, Not Yourself) forces students to check their assumptions (L), rely on map-symbol evidence (E), and walk the correct route (R).","g35-ss-economics":"Students count supplies and sort needs versus wants from the cart records, ignoring a trick card (E), weigh choices (A), and decide how to make the lemonade (R).","g35-ss-government":"Students use only real desk evidence and reject the leftover note (E), determine who decides and how a law is made as testable claims (C), and open Town Hall (R).","g35-ss-texas":"Students read Texas evidence cards and spot the trick card (E), distinguish true symbols from distractors (A), and order the timeline to free the exhibit (R).","g68-sci-cells":"Students prove whether Specimen X is a plant or animal cell as a testable claim (C), sort useful evidence cards from the useless one (E), and rule out the other cell type (A).","g68-sci-watercycle":"Lock 3 rules out culprits (A) and Lock 4 keeps only real evidence (E) to prove why the lake is dropping (C) and trace the true cause (R).","g68-sci-forces":"Students compute net force from sensor logs and reject the chatter decoy (E), decide which law fired (A), and enter codes to free the controls (R).","g68-sci-ecosystems":"Students trace energy and sort producers using field evidence (E), then find the real cause of the hawk decline versus other explanations (A) as a testable claim (C).","g68-ela-authorspurpose":"Students prove each document's purpose from its words (C), ignore the useless page and cite evidence of entertainment (E), and choose among competing purposes (A).","g68-ela-theme":"Students name theme not topic and infer rather than summarize (C), rely on what cards prove instead of assumptions (L), and drop the decoy while counting real evidence (E).","g68-ela-argument":"Students name the culprit as a claim (C), keep only proof and reject the useless card (E), rule out other clubs (A), and order the reasoning to build the case (R).","g68-ela-figurative":"Students identify each device as a testable claim (C), count comparisons and pick useful evidence (E), and distinguish metaphor from simile and other devices (A).","g68-ss-sources":"Students sort primary from secondhand sources and count reliability evidence (E), test whether the diary is authentic (C), weigh trustworthiness (A), and rank sources (R).","g68-ss-texashistory":"Students order revolution events and count battles using only what documents prove (E), determine the deciding effect among causes (A), and unlock the archive (R).","g68-ss-economics":"Students read booth records and ignore a doodle decoy (E), weigh scarcity and opportunity cost against alternatives (A), and predict the price to open the box (R).","g68-ss-constitution":"Students count powers and match jobs from constitutional evidence (E), test whether an action violates the Constitution (C), and act by spotting violations (R).","g912-sci-genetics":"Students use Punnett-square evidence (E) to test the breeder's innocence (C), weigh alternative parentage explanations (A), and file a verdict (R).","g912-sci-periodic":"Students classify a beaker and order a trend using only trustworthy evidence, rejecting the scrap card (E), name the control versus variables (A), and reopen the lab (R).","g912-sci-energy":"Stu  and reach the correct match (R).","orig-g68-signalcheck":"The full CLEAR cycle: test a viral claim (C), resist urgency/emotion bias (L), sort strong vs weak sources (E), trace it to alternative origins (A), and decide whether to share (R).","orig-g912-labreport":"Students test a “miracle study” claim (C), judge evidence strength like tiny sample size (E), demand a control group and reject correlation-as-causation (A), and issue a peer-review verdict (R)."}},"es":{"chrome":{"eyebrow":"Guía de correlación · TEKS y CLEAR","h1":"Correlación de actividades","lead":"Cada breakout por banda de grado y área de contenido, su alineación con los TEKS, la habilidad de pensamiento crítico que desarrolla y cómo se corresponde con el Proceso de Pensamiento CLEAR, la lista de verificación de pensamiento crítico de 5 pasos que practican los estudiantes.","legendTitle":"El Proceso de Pensamiento CLEAR","filterLabel":"Filtrar:","all":"Todos","print":"🖨 Imprimir / Guardar PDF","crumb":"‹ Breakouts de Pensamiento Crítico","colActivity":"Actividad","colArea":"Área de contenido","colTeks":"Alineación con TEKS","colSkill":"Habilidad de pensamiento crítico","colClear":"Pasos CLEAR","colConn":"Cómo se conecta con CLEAR","origTag":"original","language":"Idioma","footer":"Breakouts de Pensamiento Crítico · Correlacionados con el Proceso de Pensamiento CLEAR y los Conocimientos y Habilidades Esenciales de Texas (TEKS). La letra delineada marca el paso principal de CLEAR de cada actividad."},"clear":{"C":{"name":"Afirmación","q":"¿Qué se está diciendo exactamente?"},"L":{"name":"Lente","q":"¿Qué suposiciones estoy aportando?"},"E":{"name":"Evidencia","q":"¿Qué respalda la afirmación?"},"A":{"name":"Alternativas","q":"¿Qué más podría explicar esto?"},"R":{"name":"Respuesta","q":"¿Qué debo hacer ahora?"}},"subjects":{"Science":"Ciencias","ELA":"Inglés / Artes del Lenguaje","Social Studies":"Estudios Sociales","Logic & Observation":"Lógica y Observación","Media Literacy":"Alfabetización Mediática","Scientific Reasoning":"Razonamiento Científico"},"skills":{"Science":"Razonamiento científico basado en evidencia","ELA":"Evidencia textual, inferencia y análisis","Social Studies":"Uso de fuentes, causa y efecto, razonamiento a partir de evidencia","orig-g35-lunchroom":"Relacionar la evidencia con las afirmaciones; ignorar las pistas irrelevantes","orig-g68-signalcheck":"Rastrear una afirmación hasta su fuente; evaluar la fiabilidad de la fuente","orig-g912-labreport":"Evaluar el diseño de un estudio; separar correlación de causalidad"},"origTitles":{"orig-g35-lunchroom":"El comedor revuelto","orig-g68-signalcheck":"Verificación de señal: la afirmación viral","orig-g912-labreport":"Cierre del informe de laboratorio"},"connections":{"g35-sci-lifecycle":"Los estudiantes distinguen la evidencia real de cámara/cuaderno de una carta engañosa (E), descartan otras explicaciones para la oruga desaparecida (A) y demuestran qué ocurrió (C, R).","g35-sci-matter":"Los estudiantes leen datos del cuaderno de laboratorio y rechazan el señuelo del garabato (E), distinguen entre estados/cambios de la materia rivales (A) y actúan para reabrir la bóveda con seguridad (R).","g35-sci-foodchain":"Los estudiantes rastrean la energía usando evidencia de campo e ignoran una carta inútil (E), consideran qué eslabón roto hizo fracasar la pradera (A) y luego abren el cobertizo (R).","g35-sci-weather":"Los estudiantes usan solo datos genuinos de instrumentos meteorológicos (E), predicen lo que viene como una afirmación comprobable (C) y evalúan posibles patrones climáticos (A).","g35-ela-mainidea":"Los estudiantes identifican la única idea principal (C), reúnen detalles de apoyo como evidencia y detectan la pista inútil (E), y separan la idea principal de los meros detalles (A).","g35-ela-factopinion":"Los estudiantes prueban cada afirmación como un hecho verificable frente a una opinión (C), notan palabras clave y sesgo personal (L), y conservan solo evidencia verificable, descartando la carta inútil (E).","g35-ela-sequence":"Los estudiantes ordenan los eventos de la trama usando palabras de prueba y rechazan una carta inútil (E), consideran qué orden encaja realmente (A) y reconstruyen la receta para abrir la cocina (R).","g35-ela-context":"Los estudiantes infieren el significado de una palabra como una afirmación comprobable (C), recopilan pistas del contexto circundante como prueba (E) y eligen entre posibles sinónimos/significados (A).","g35-ss-mapskills":"El candado 5 (Confía en el mapa, no en ti mismo) obliga a los estudiantes a revisar sus suposiciones (L), a apoyarse en la evidencia de los símbolos del mapa (E) y a recorrer la ruta correcta (R).","g35-ss-economics":"Los estudiantes cuentan los suministros y clasifican necesidades frente a deseos a partir de los registros del carrito, ignorando una carta engañosa (E), evalúan opciones (A) y deciden cómo hacer la limonada (R).","g35-ss-government":"Los estudiantes usan solo evidencia real del escritorio y rechazan la nota sobrante (E), determinan quién decide y cómo se hace una ley como afirmaciones comprobables (C) y abren el ayuntamiento (R).","g35-ss-texas":"Los estudiantes leen tarjetas de evidencia de Texas y detectan la carta engañosa (E), distinguen los símbolos verdaderos de los distractores (A) y ordenan la línea de tiempo para liberar la exhibición (R).","g68-sci-cells":"Los estudiantes demuestran si el Specimen X es una célula vegetal o animal como una afirmación comprobable (C), separan las tarjetas de evidencia útil de la inútil (E) y descartan el otro tipo de célula (A).","g68-sci-watercycle":"El candado 3 descarta culpables (A) y el candado 4 conserva solo evidencia real (E) para demostrar por qué baja el lago (C) y rastrear la causa verdadera (R).","g68-sci-forces":"Los estudiantes calculan la fuerza neta a partir de los registros del sensor y rechazan el señuelo de charla (E), deciden qué ley se activó (A) e introducen códigos para liberar los controles (R).","g68-sci-ecosystems":"Los estudiantes rastrean la energía y clasifican a los productores usando evidencia de campo (E), luego encuentran la causa real del declive del halcón frente a otras explicaciones (A) como una afirmación comprobable (C).","g68-ela-authorspurpose":"Los estudiantes demuestran el propósito de cada documento a partir de sus palabras (C), ignoran la página inútil y citan evidencia de entretenimiento (E), y eligen entre propósitos rivales (A).","g68-ela-theme":"Los estudiantes nombran el tema y no el asunto e infieren en lugar de resumir (C), se apoyan en lo que prueban las tarjetas en vez de en suposiciones (L) y descartan el señuelo mientras cuentan la evidencia real (E).","g68-ela-argument":"Los estudiantes nombran al culpable como una afirmación (C), conservan solo la prueba y rechazan la carta inútil (E), descartan otros clubes (A) y ordenan el razonamiento para armar el caso (R).","g68-ela-figurative":"Los estudiantes identifican cada recurso como una afirmación comprobable (C), cuentan las comparaciones y eligen la evidencia útil (E), y distinguen la metáfora del símil y otros recursos (A).","g68-ss-sources":"Los estudiantes separan las fuentes primarias de las secundarias y cuentan la evidencia de fiabilidad (E), prueban si el diario es auténtico (C), evalúan la confiabilidad (A) y clasifican las fuentes (R).","g68-ss-texashistory":"Los estudiantes ordenan los eventos de la revolución y cuentan las batallas usando solo lo que prueban los documentos (E), determinan el efecto decisivo entre las causas (A) y abren el archivo (R).","g68-ss-economics":"Los estudiantes leen los registros del puesto e ignoran un señuelo de garabato (E), sopesan la escasez y el costo de oportunidad frente a las alternativas (A) y predicen el precio para abrir la caja (R).","g68-ss-constitution":"Los estudiantes cuentan los poderes y relacionan los cargos a partir de la evidencia constitucional (E), prueban si una acción viola la Constitución (C) y actúan detectando violaciones (R).","g912-sci-genetics":"Los estudiantes usan la evidencia del cuadro de Punnett (E) para probar la inocencia del criador (C), evalúan explicaciones alternativas de parentesco (A) y emiten un veredicto (R).","g912-sci-periodic":"Los estudiantes clasifican un vaso de precipitados y ordenan una tendencia usando solo evidencia confiable, rechazando la carta descartada (E), nombran el control frente a las variables (A) y reabren el laboratorio (R).","g912-sci-energy":"Los estudiantes calculan la velocidad y los intercambios de energía a partir de datos del sensor y conservan solo evidencia real (E), nombran la ley como una afirmación comprobable (C) y sueltan los frenos (R).","g912-sci-expdesign":"Los estudiantes aíslan causa y efecto como una hipótesis (C), leen las notas de laboratorio en busca de pruebas (E) e identifican las variables controladas y el grupo de control frente a los factores de confusión (A).","g912-ela-rhetoric":"Los estudiantes detectan las apelaciones emocionales (pathos) frente a las lógicas, sacando a la luz cómo el tono los influye (L), conservan solo la evidencia de logos (E) y comparan los tipos de apelación (A).","g912-ela-fallacies":"Los estudiantes prueban qué falacia comete cada argumento como una afirmación comprobable (C), ven cómo los ataques manipulan el sesgo (L), rechazan el señuelo del menú (E) y distinguen trucos gemelos (A).","g912-ela-sources":"Los estudiantes prueban si el estudio viral es creíble (C), ponen en cuarentena las fuentes débiles y cuentan las pistas basura (E), clasifican las alternativas (A) y verifican en el orden correcto (R).","g912-ela-tone":"Los estudiantes nombran la actitud del escritor y su cambio (L), infieren el tono como una afirmación comprobable en lugar de un sentimiento declarado (C) y citan las palabras de ambiente como evidencia (E).","g912-ss-government":"Los estudiantes usan la evidencia constitucional (E) para probar si un acto oficial es legítimo (C) y actúan aplicando controles como el veto anulado y los derechos del acusado (R).","g912-ss-economics":"Los estudiantes leen datos del libro contable para demostrar por qué subieron los precios (C, E), nombran el costo de oportunidad y sopesan explicaciones económicas rivales para el aumento del precio (A).","g912-ss-history":"Los estudiantes detectan el señuelo y cuentan las negativas a partir de la evidencia (E), dejan que el rastro documental y no las fechas memorizadas decida (L), encuentran la causa raíz entre las alternativas (A) y prueban la afirmación (C).","g912-ss-geography":"Los estudiantes prueban la afirmación del panel de que el canal salvó la región (C), separan las consecuencias reales del señuelo (E), sopesan otras causas (A) y emiten un veredicto (R).","orig-g35-lunchroom":"Los estudiantes relacionan las bandejas usando solo lo que prueban las pistas e ignoran el señuelo del perro perdido (E), cruzan una alergia con una bandeja para descartar respuestas incorrectas (A, C) y llegan a la correspondencia correcta (R).","orig-g68-signalcheck":"El ciclo CLEAR completo: probar una afirmación viral (C), resistir el sesgo de urgencia/emoción (L), separar las fuentes fuertes de las débiles (E), rastrearla hasta orígenes alternativos (A) y decidir si compartirla (R).","orig-g912-labreport":"Los estudiantes prueban la afirmación de un “estudio milagroso” (C), juzgan la solidez de la evidencia como el tamaño diminuto de la muestra (E), exigen un grupo de control y rechazan la correlación como causalidad (A), y emiten un veredicto de revisión por pares (R)."}},"vi":{"chrome":{"eyebrow":"Hướng dẫn tương quan · TEKS và CLEAR","h1":"Tương quan hoạt động","lead":"Mỗi trò chơi breakout theo cấp lớp và lĩnh vực nội dung, sự phù hợp với TEKS, kỹ năng tư duy phản biện mà nó xây dựng, và cách nó ánh xạ vào Quy trình Tư duy CLEAR — bảng kiểm tư duy phản biện gồm 5 bước mà học sinh thực hành.","legendTitle":"Quy trình Tư duy CLEAR","filterLabel":"Lọc:","all":"Tất cả","print":"🖨 In / Lưu PDF","crumb":"‹ Trò chơi Breakout Tư duy Phản biện","colActivity":"Hoạt động","colArea":"Lĩnh vực nội dung","colTeks":"Sự phù hợp với TEKS","colSkill":"Kỹ năng tư duy phản biện","colClear":"Các bước CLEAR","colConn":"Cách nó kết nối với CLEAR","origTag":"gốc","language":"Ngôn ngữ","footer":"Trò chơi Breakout Tư duy Phản biện · Được tương quan với Quy trình Tư duy CLEAR và Kiến thức và Kỹ năng Thiết yếu của Texas (TEKS). Chữ cái được viền đánh dấu bước CLEAR chính của mỗi hoạt động."},"clear":{"C":{"name":"Khẳng định","q":"Chính xác thì điều gì đang được nói?"},"L":{"name":"Lăng kính","q":"Tôi đang mang theo những giả định nào?"},"E":{"name":"Bằng chứng","q":"Điều gì hỗ trợ cho khẳng định?"},"A":{"name":"Phương án khác","q":"Còn điều gì khác có thể giải thích cho việc này?"},"R":{"name":"Phản hồi","q":"Bây giờ tôi nên làm gì?"}},"subjects":{"Science":"Khoa học","ELA":"Tiếng Anh / Nghệ thuật Ngôn ngữ","Social Studies":"Nghiên cứu Xã hội","Logic & Observation":"Logic và Quan sát","Media Literacy":"Hiểu biết Truyền thông","Scientific Reasoning":"Lập luận Khoa học"},"skills":{"Science":"Lập luận khoa học dựa trên bằng chứng","ELA":"Bằng chứng văn bản, suy luận và phân tích","Social Studies":"Tìm nguồn, nhân quả, lập luận từ bằng chứng","orig-g35-lunchroom":"Khớp bằng chứng với khẳng định; bỏ qua manh mối không liên quan","orig-g68-signalcheck":"Truy nguồn của một khẳng định; đánh giá độ tin cậy của nguồn","orig-g912-labreport":"Đánh giá thiết kế nghiên cứu; phân biệt tương quan với nhân quả"},"origTitles":{"orig-g35-lunchroom":"Nhà ăn lộn xộn","orig-g68-signalcheck":"Kiểm tra tín hiệu: Khẳng định lan truyền","orig-g912-labreport":"Phong tỏa báo cáo phòng thí nghiệm"},"connections":{"g35-sci-lifecycle":"Học sinh phân loại bằng chứng thật từ máy ảnh/sổ tay khỏi một thẻ đánh lừa (E), loại trừ các cách giải thích khác cho con sâu bướm mất tích (A), và chứng minh điều đã xảy ra (C, R).","g35-sci-matter":"Học sinh đọc dữ liệu sổ tay phòng thí nghiệm và loại bỏ mồi nhử hình vẽ nguệch ngoạc (E), phân biệt các trạng thái/biến đổi vật chất cạnh tranh (A), và hành động để mở lại hầm chứa an toàn (R).","g35-sci-foodchain":"Học sinh truy tìm năng lượng bằng bằng chứng thực địa và bỏ qua một thẻ vô dụng (E), xem xét mắt xích đứt gãy nào khiến đồng cỏ suy tàn (A), rồi mở khóa nhà kho (R).","g35-sci-weather":"Học sinh chỉ dùng dữ liệu thật từ dụng cụ thời tiết (E), dự đoán điều sắp tới như một khẳng định có thể kiểm chứng (C), và cân nhắc các hình thái thời tiết có thể xảy ra (A).","g35-ela-mainidea":"Học sinh xác định một ý chính duy nhất (C), thu thập các chi tiết hỗ trợ làm bằng chứng và phát hiện manh mối vô dụng (E), và tách ý chính khỏi các chi tiết đơn thuần (A).","g35-ela-factopinion":"Học sinh kiểm tra từng phát biểu như một sự thật có thể kiểm chứng so với ý kiến (C), nhận ra các từ tín hiệu và thiên kiến cá nhân (L), và chỉ giữ lại bằng chứng có thể xác minh, loại bỏ thẻ vô dụng (E).","g35-ela-sequence":"Học sinh sắp xếp các sự kiện cốt truyện bằng các từ chứng cứ và loại bỏ một thẻ vô dụng (E), xem xét thứ tự nào thực sự phù hợp (A), và ráp lại công thức để mở khóa nhà bếp (R).","g35-ela-context":"Học sinh suy luận nghĩa của một từ như một khẳng định có thể kiểm chứng (C), thu thập manh mối ngữ cảnh xung quanh làm chứng cứ (E), và chọn giữa các từ đồng nghĩa/nghĩa có thể có (A).","g35-ss-mapskills":"Ổ khóa 5 (Tin bản đồ, đừng tin bản thân) buộc học sinh kiểm tra các giả định của mình (L), dựa vào bằng chứng ký hiệu bản đồ (E), và đi đúng lộ trình (R).","g35-ss-economics":"Học sinh đếm vật tư và phân loại nhu cầu so với mong muốn từ hồ sơ xe đẩy, bỏ qua một thẻ đánh lừa (E), cân nhắc các lựa chọn (A), và quyết định cách làm nước chanh (R).","g35-ss-government":"Học sinh chỉ dùng bằng chứng thật trên bàn và loại bỏ tờ ghi chú còn sót (E), xác định ai quyết định và luật được làm ra như thế nào như những khẳng định có thể kiểm chứng (C), và mở Tòa thị chính (R).","g35-ss-texas":"Học sinh đọc các thẻ bằng chứng về Texas và phát hiện thẻ đánh lừa (E), phân biệt biểu tượng thật với các yếu tố gây nhiễu (A), và sắp xếp dòng thời gian để giải phóng khu trưng bày (R).","g68-sci-cells":"Học sinh chứng minh liệu Specimen X là tế bào thực vật hay động vật như một khẳng định có thể kiểm chứng (C), phân loại thẻ bằng chứng hữu ích khỏi thẻ vô dụng (E), và loại trừ loại tế bào còn lại (A).","g68-sci-watercycle":"Ổ khóa 3 loại trừ thủ phạm (A) và ổ khóa 4 chỉ giữ lại bằng chứng thật (E) để chứng minh vì sao mực nước hồ đang hạ (C) và truy tìm nguyên nhân thật (R).","g68-sci-forces":"Học sinh tính lực tổng hợp từ nhật ký cảm biến và loại bỏ mồi nhử gây nhiễu (E), quyết định định luật nào đã tác động (A), và nhập mã để giải phóng bộ điều khiển (R).","g68-sci-ecosystems":"Học sinh truy tìm năng lượng và phân loại sinh vật sản xuất bằng bằng chứng thực địa (E), rồi tìm nguyên nhân thật của sự suy giảm diều hâu so với các cách giải thích khác (A) như một khẳng định có thể kiểm chứng (C).","g68-ela-authorspurpose":"Học sinh chứng minh mục đích của từng tài liệu từ chính lời văn (C), bỏ qua trang vô dụng và trích dẫn bằng chứng về giải trí (E), và chọn giữa các mục đích cạnh tranh (A).","g68-ela-theme":"Học sinh gọi tên chủ đề chứ không phải đề tài và suy luận thay vì tóm tắt (C), dựa vào những gì các thẻ chứng minh thay vì giả định (L), và loại bỏ mồi nhử trong khi đếm bằng chứng thật (E).","g68-ela-argument":"Học sinh gọi tên thủ phạm như một khẳng định (C), chỉ giữ chứng cứ và loại bỏ thẻ vô dụng (E), loại trừ các câu lạc bộ khác (A), và sắp xếp lập luận để dựng nên vụ án (R).","g68-ela-figurative":"Học sinh xác định từng biện pháp như một khẳng định có thể kiểm chứng (C), đếm các phép so sánh và chọn bằng chứng hữu ích (E), và phân biệt ẩn dụ với so sánh và các biện pháp khác (A).","g68-ss-sources":"Học sinh phân loại nguồn sơ cấp khỏi nguồn thứ cấp và đếm bằng chứng về độ tin cậy (E), kiểm tra xem cuốn nhật ký có xác thực không (C), cân nhắc mức độ đáng tin (A), và xếp hạng các nguồn (R).","g68-ss-texashistory":"Học sinh sắp xếp các sự kiện cách mạng và đếm các trận chiến chỉ dùng những gì tài liệu chứng minh (E), xác định hệ quả quyết định trong số các nguyên nhân (A), và mở khóa kho lưu trữ (R).","g68-ss-economics":"Học sinh đọc hồ sơ quầy hàng và bỏ qua mồi nhử hình vẽ nguệch ngoạc (E), cân nhắc sự khan hiếm và chi phí cơ hội so với các phương án khác (A), và dự đoán giá để mở hộp (R).","g68-ss-constitution":"Học sinh đếm các quyền hạn và ghép các chức vụ từ bằng chứng hiến pháp (E), kiểm tra xem một hành động có vi phạm Hiến pháp không (C), và hành động bằng cách phát hiện vi phạm (R).","g912-sci-genetics":"Học sinh dùng bằng chứng ô Punnett (E) để kiểm tra sự vô tội của người lai giống (C), cân nhắc các cách giải thích về nguồn gốc cha mẹ khác (A), và đưa ra phán quyết (R).","g912-sci-periodic":"Học sinh phân loại một cốc thủy tinh và sắp xếp một xu hướng chỉ dùng bằng chứng đáng tin, loại bỏ thẻ vụn (E), gọi tên đối chứng so với biến số (A), và mở lại phòng thí nghiệm (R).","g912-sci-energy":"Học sinh tính tốc độ và các đánh đổi năng lượng từ dữ liệu cảm biến và chỉ giữ bằng chứng thật (E), gọi tên định luật như một khẳng định có thể kiểm chứng (C), và nhả phanh (R).","g912-sci-expdesign":"Học sinh cô lập nhân và quả như một giả thuyết (C), đọc ghi chú phòng thí nghiệm để tìm chứng cứ (E), và xác định các biến được kiểm soát và nhóm đối chứng so với các yếu tố gây nhiễu (A).","g912-ela-rhetoric":"Học sinh phát hiện lời kêu gọi cảm xúc (pathos) so với lời kêu gọi logic, làm lộ ra cách giọng điệu tác động đến họ (L), chỉ giữ bằng chứng logos (E), và so sánh các loại lời kêu gọi (A).","g912-ela-fallacies":"Học sinh chứng minh mỗi lập luận phạm phải ngụy biện nào như một khẳng định có thể kiểm chứng (C), thấy cách các đòn công kích thao túng thiên kiến (L), loại bỏ mồi nhử thực đơn (E), và phân biệt các mánh khóe song sinh (A).","g912-ela-sources":"Học sinh kiểm tra xem nghiên cứu lan truyền có đáng tin không (C), cách ly các nguồn yếu và đếm các manh mối rác (E), xếp hạng các phương án (A), và xác minh theo đúng thứ tự (R).","g912-ela-tone":"Học sinh gọi tên thái độ của tác giả và sự thay đổi của nó (L), suy luận giọng điệu như một khẳng định có thể kiểm chứng thay vì một cảm xúc được nêu ra (C), và trích dẫn các từ chỉ tâm trạng làm bằng chứng (E).","g912-ss-government":"Học sinh dùng bằng chứng hiến pháp (E) để kiểm tra xem một hành động chính thức có hợp pháp không (C) và hành động bằng cách áp dụng các cơ chế kiểm soát như phủ quyết đảo ngược và quyền của bị cáo (R).","g912-ss-economics":"Học sinh đọc dữ liệu sổ cái để chứng minh vì sao giá tăng (C, E), gọi tên chi phí cơ hội, và cân nhắc các cách giải thích kinh tế cạnh tranh cho sự tăng giá (A).","g912-ss-history":"Học sinh phát hiện mồi nhử và đếm các lần từ chối từ bằng chứng (E), để dấu vết giấy tờ chứ không phải ngày tháng thuộc lòng quyết định (L), tìm nguyên nhân gốc rễ trong số các phương án (A), và chứng minh khẳng định (C).","g912-ss-geography":"Học sinh kiểm tra khẳng định của hội đồng rằng con kênh đã cứu vùng đất (C), phân loại hệ quả thật khỏi mồi nhử (E), cân nhắc các nguyên nhân khác (A), và đưa ra phán quyết (R).","orig-g35-lunchroom":"Học sinh khớp các khay chỉ dùng những gì manh mối chứng minh và bỏ qua mồi nhử chó lạc (E), đối chiếu một dị ứng với một khay để loại trừ đáp án sai (A, C), và đạt được sự khớp đúng (R).","orig-g68-signalcheck":"Chu trình CLEAR đầy đủ: kiểm tra một khẳng định lan truyền (C), chống lại thiên kiến khẩn cấp/cảm xúc (L), phân loại nguồn mạnh so với nguồn yếu (E), truy nó về các nguồn gốc thay thế (A), và quyết định có chia sẻ hay không (R).","orig-g912-labreport":"Học sinh kiểm tra khẳng định về một “nghiên cứu kỳ diệu” (C), đánh giá độ mạnh của bằng chứng như cỡ mẫu quá nhỏ (E), đòi hỏi một nhóm đối chứng và bác bỏ việc coi tương quan là nhân quả (A), và đưa ra phán quyết bình duyệt (R)."}},"zh":{"chrome":{"eyebrow":"关联指南 · TEKS 与 CLEAR","h1":"活动关联","lead":"按年级段和内容领域列出的每个破解游戏、其与 TEKS 的对齐、它培养的批判性思维技能，以及它如何对应 CLEAR 思维流程——学生练习的五步批判性思维清单。","legendTitle":"CLEAR 思维流程","filterLabel":"筛选：","all":"全部","print":"🖨 打印 / 保存 PDF","crumb":"‹ 批判性思维破解游戏","colActivity":"活动","colArea":"内容领域","colTeks":"TEKS 对齐","colSkill":"批判性思维技能","colClear":"CLEAR 步骤","colConn":"它如何与 CLEAR 关联","origTag":"原创","language":"语言","footer":"批判性思维破解游戏 · 与 CLEAR 思维流程及《得克萨斯基本知识与技能》(TEKS) 关联。轮廓字母标示每个活动的主要 CLEAR 步骤。"},"clear":{"C":{"name":"主张","q":"到底在说什么？"},"L":{"name":"视角","q":"我带入了哪些假设？"},"E":{"name":"证据","q":"有什么支持这个主张？"},"A":{"name":"其他可能","q":"还有什么可以解释这一点？"},"R":{"name":"回应","q":"我现在应该怎么做？"}},"subjects":{"Science":"科学","ELA":"英语 / 语言艺术","Social Studies":"社会研究","Logic & Observation":"逻辑与观察","Media Literacy":"媒体素养","Scientific Reasoning":"科学推理"},"skills":{"Science":"基于证据的科学推理","ELA":"文本证据、推断与分析","Social Studies":"溯源、因果关系、从证据中推理","orig-g35-lunchroom":"将证据与主张匹配；忽略无关线索","orig-g68-signalcheck":"追溯主张的来源；衡量来源的可靠性","orig-g912-labreport":"评估研究设计；区分相关性与因果关系"},"origTitles":{"orig-g35-lunchroom":"混乱的午餐室","orig-g68-signalcheck":"信号核查：疯传的主张","orig-g912-labreport":"实验报告封锁"},"connections":{"g35-sci-lifecycle":"学生从骗术卡中分辨出真实的相机/笔记本证据 (E)，排除毛毛虫失踪的其他解释 (A)，并证明发生了什么 (C, R)。","g35-sci-matter":"学生阅读实验笔记本数据并剔除涂鸦诱饵 (E)，区分相互竞争的物质状态/变化 (A)，并采取行动安全地重新打开保险库 (R)。","g35-sci-foodchain":"学生利用实地证据追踪能量并忽略一张无用卡片 (E)，思考是哪个断裂的环节导致草地衰败 (A)，然后解锁棚屋 (R)。","g35-sci-weather":"学生只使用真实的气象工具数据 (E)，将即将到来的天气作为可检验的主张进行预测 (C)，并权衡可能的天气模式 (A)。","g35-ela-mainidea":"学生找出唯一的主要观点 (C)，收集支持性细节作为证据并识别无用线索 (E)，并将主要观点与单纯的细节区分开来 (A)。","g35-ela-factopinion":"学生把每个陈述当作可核查的事实与观点来检验 (C)，注意信号词和个人偏见 (L)，只保留可验证的证据，剔除无用卡片 (E)。","g35-ela-sequence":"学生使用证据词语给情节事件排序并剔除一张无用卡片 (E)，思考哪种顺序真正合适 (A)，并重新拼出食谱以解锁厨房 (R)。","g35-ela-context":"学生把一个词的含义作为可检验的主张来推断 (C)，收集周围的上下文线索作为证据 (E)，并在可能的同义词/含义中做出选择 (A)。","g35-ss-mapskills":"第 5 号锁（相信地图，别相信自己）迫使学生检查自己的假设 (L)，依靠地图符号证据 (E)，并走对正确的路线 (R)。","g35-ss-economics":"学生从购物车记录中清点物资并区分需要与想要，忽略一张骗术卡 (E)，权衡选择 (A)，并决定如何制作柠檬水 (R)。","g35-ss-government":"学生只使用桌上的真实证据并剔除遗留的便条 (E)，把谁来决定以及法律如何制定作为可检验的主张来确定 (C)，并打开市政厅 (R)。","g35-ss-texas":"学生阅读得克萨斯证据卡并识别骗术卡 (E)，区分真正的符号与干扰项 (A)，并给时间线排序以解放展品 (R)。","g68-sci-cells":"学生把 Specimen X 是植物细胞还是动物细胞作为可检验的主张来证明 (C)，从无用卡片中分拣出有用的证据卡 (E)，并排除另一种细胞类型 (A)。","g68-sci-watercycle":"第 3 号锁排除嫌疑对象 (A)，第 4 号锁只保留真实证据 (E)，以证明湖水为何下降 (C) 并追溯真正原因 (R)。","g68-sci-forces":"学生根据传感器日志计算合力并剔除干扰诱饵 (E)，判断哪条定律起了作用 (A)，并输入代码解放控制装置 (R)。","g68-sci-ecosystems":"学生利用实地证据追踪能量并分拣生产者 (E)，然后找出鹰数量下降的真正原因而非其他解释 (A)，作为可检验的主张 (C)。","g68-ela-authorspurpose":"学生从文字本身证明每份文档的目的 (C)，忽略无用的页面并引用娱乐目的的证据 (E)，并在相互竞争的目的中做出选择 (A)。","g68-ela-theme":"学生说出主题而非话题，并进行推断而非概括 (C)，依靠卡片所证明的而非假设 (L)，剔除诱饵同时清点真实证据 (E)。","g68-ela-argument":"学生把罪魁祸首作为一个主张说出来 (C)，只保留证据并剔除无用卡片 (E)，排除其他社团 (A)，并给推理排序以构建案件 (R)。","g68-ela-figurative":"学生把每种修辞手法作为可检验的主张来识别 (C)，清点比较并挑选有用的证据 (E)，并区分暗喻与明喻及其他手法 (A)。","g68-ss-sources":"学生把第一手来源与第二手来源分开并清点可靠性证据 (E)，检验日记是否真实 (C)，权衡可信度 (A)，并给来源排序 (R)。","g68-ss-texashistory":"学生给革命事件排序并只用文件所证明的来清点战役 (E)，在各原因中确定决定性的影响 (A)，并解锁档案库 (R)。","g68-ss-economics":"学生阅读摊位记录并忽略一个涂鸦诱饵 (E)，权衡稀缺性和机会成本与其他方案 (A)，并预测价格以打开盒子 (R)。","g68-ss-constitution":"学生根据宪法证据清点权力并匹配职务 (E)，检验某一行为是否违反宪法 (C)，并通过识别违规行为来采取行动 (R)。","g912-sci-genetics":"学生使用庞纳特方格（Punnett）证据 (E) 来检验育种者的清白 (C)，权衡关于亲代的其他解释 (A)，并作出裁决 (R)。","g912-sci-periodic":"学生只用可信证据对一个烧杯进行分类并给一个趋势排序，剔除废弃卡片 (E)，说出对照与变量 (A)，并重新打开实验室 (R)。","g912-sci-energy":"学生根据传感器数据计算速度和能量转换并只保留真实证据 (E)，把定律作为可检验的主张说出来 (C)，并松开刹车 (R)。","g912-sci-expdesign":"学生把因果关系作为假设来隔离 (C)，阅读实验记录以寻找证据 (E)，并识别受控变量以及对照组与混淆因素 (A)。","g912-ela-rhetoric":"学生辨别情感诉求 (pathos) 与逻辑诉求，揭示语气如何影响他们 (L)，只保留逻辑 (logos) 证据 (E)，并比较诉求类型 (A)。","g912-ela-fallacies":"学生把每个论证所犯的谬误作为可检验的主张来证明 (C)，看清攻击如何操纵偏见 (L)，剔除菜单诱饵 (E)，并区分孪生把戏 (A)。","g912-ela-sources":"学生检验疯传的研究是否可信 (C)，隔离薄弱来源并清点垃圾线索 (E)，给其他方案排序 (A)，并按正确顺序核实 (R)。","g912-ela-tone":"学生说出作者的态度及其转变 (L)，把语气作为可检验的主张而非明说的情感来推断 (C)，并引用表达情绪的词语作为证据 (E)。","g912-ss-government":"学生使用宪法证据 (E) 来检验某项官方行为是否合法 (C)，并通过运用推翻否决和被告权利等制衡手段来采取行动 (R)。","g912-ss-economics":"学生阅读账簿数据以证明价格为何上涨 (C, E)，说出机会成本，并权衡对价格上涨相互竞争的经济解释 (A)。","g912-ss-history":"学生识别诱饵并从证据中清点拒绝的次数 (E)，让书面记录而非死记的日期来决定 (L)，在各方案中找出根本原因 (A)，并证明主张 (C)。","g912-ss-geography":"学生检验专家组关于运河拯救了该地区的主张 (C)，从诱饵中分拣出真实后果 (E)，权衡其他原因 (A)，并作出裁决 (R)。","orig-g35-lunchroom":"学生只用线索所证明的来匹配餐盘并忽略走失的狗这一诱饵 (E)，将过敏与餐盘交叉比对以排除错误答案 (A, C)，并达成正确的匹配 (R)。","orig-g68-signalcheck":"完整的 CLEAR 循环：检验一个疯传的主张 (C)，抵制紧迫感/情绪偏见 (L)，分拣强来源与弱来源 (E)，追溯它到其他起源 (A)，并决定是否分享 (R)。","orig-g912-labreport":"学生检验一项“奇迹研究”的主张 (C)，判断证据强度，例如样本量过小 (E)，要求设立对照组并拒绝把相关性当作因果关系 (A)，并作出同行评审裁决 (R)。"}},"hi":{"chrome":{"eyebrow":"सहसंबंध मार्गदर्शिका · TEKS और CLEAR","h1":"गतिविधि सहसंबंध","lead":"ग्रेड बैंड और विषय क्षेत्र के अनुसार प्रत्येक ब्रेकआउट, उसका TEKS संरेखण, वह जो आलोचनात्मक-चिंतन कौशल विकसित करता है, और यह CLEAR चिंतन प्रक्रिया से कैसे जुड़ता है — वह 5-चरणीय आलोचनात्मक-चिंतन जाँच-सूची जिसका छात्र अभ्यास करते हैं।","legendTitle":"CLEAR चिंतन प्रक्रिया","filterLabel":"छाँटें:","all":"सभी","print":"🖨 प्रिंट करें / PDF सहेजें","crumb":"‹ आलोचनात्मक चिंतन ब्रेकआउट","colActivity":"गतिविधि","colArea":"विषय क्षेत्र","colTeks":"TEKS संरेखण","colSkill":"आलोचनात्मक-चिंतन कौशल","colClear":"CLEAR चरण","colConn":"यह CLEAR से कैसे जुड़ता है","origTag":"मूल","language":"भाषा","footer":"आलोचनात्मक चिंतन ब्रेकआउट · CLEAR चिंतन प्रक्रिया और टेक्सास आवश्यक ज्ञान एवं कौशल (TEKS) से सहसंबंधित। रूपरेखा वाला अक्षर प्रत्येक गतिविधि के प्राथमिक CLEAR चरण को चिह्नित करता है।"},"clear":{"C":{"name":"दावा","q":"वास्तव में क्या कहा जा रहा है?"},"L":{"name":"दृष्टिकोण","q":"मैं कौन-सी पूर्वधारणाएँ ला रहा हूँ?"},"E":{"name":"साक्ष्य","q":"दावे का समर्थन क्या करता है?"},"A":{"name":"विकल्प","q":"इसे और क्या समझा सकता है?"},"R":{"name":"प्रतिक्रिया","q":"अब मुझे क्या करना चाहिए?"}},"subjects":{"Science":"विज्ञान","ELA":"अंग्रेज़ी / भाषा कला","Social Studies":"सामाजिक अध्ययन","Logic & Observation":"तर्क और अवलोकन","Media Literacy":"मीडिया साक्षरता","Scientific Reasoning":"वैज्ञानिक तर्क"},"skills":{"Science":"साक्ष्य-आधारित वैज्ञानिक तर्क","ELA":"पाठ्य साक्ष्य, अनुमान और विश्लेषण","Social Studies":"स्रोत-निर्धारण, कारण एवं प्रभाव, साक्ष्य से तर्क","orig-g35-lunchroom":"साक्ष्य को दावों से मिलाएँ; असंगत संकेतों को अनदेखा करें","orig-g68-signalcheck":"किसी दावे को उसके स्रोत तक ले जाएँ; eography":"छात्र पैनल के इस दावे को परखते हैं कि नहर ने क्षेत्र को बचाया (C), प्रलोभन से असली परिणामों को छाँटते हैं (E), अन्य कारणों को तौलते हैं (A), और एक फैसला सुनाते हैं (R)।","orig-g35-lunchroom":"छात्र केवल संकेतों द्वारा सिद्ध बातों का उपयोग करके ट्रे मिलाते हैं और खोए-कुत्ते के प्रलोभन को अनदेखा करते हैं (E), गलत उत्तरों को खारिज करने के लिए एक एलर्जी को एक ट्रे से मिलान करते हैं (A, C), और सही मिलान तक पहुँचते हैं (R)।","orig-g68-signalcheck":"संपूर्ण CLEAR चक्र: एक वायरल दावे को परखना (C), तात्कालिकता/भावना के पूर्वाग्रह का प्रतिरोध करना (L), मज़बूत बनाम कमज़ोर स्रोतों को छाँटना (E), इसे वैकल्पिक उद्गमों तक ले जाना (A), और यह तय करना कि साझा करें या नहीं (R)।","orig-g912-labreport":"छात्र एक “चमत्कारी अध्ययन” के दावे को परखते हैं (C), साक्ष्य की मज़बूती, जैसे बहुत छोटे नमूने के आकार का, आकलन करते हैं (E), एक नियंत्रण समूह की माँग करते हैं और सहसंबंध-को-कार्यकारण मानने को अस्वीकार करते हैं (A), और एक सहकर्मी-समीक्षा फैसला जारी करते हैं (R)।"}},"ar":{"chrome":{"eyebrow":"دليل الربط · TEKS وCLEAR","h1":"ربط الأنشطة","lead":"كل لعبة اختراق حسب النطاق الدراسي والمجال الدراسي، ومواءمتها مع معايير TEKS، ومهارة التفكير الناقد التي تنمّيها، وكيفية تطابقها مع عملية التفكير CLEAR — قائمة التحقق للتفكير الناقد المكوّنة من 5 خطوات التي يتدرّب عليها الطلاب.","legendTitle":"عملية التفكير CLEAR","filterLabel":"تصفية:","all":"الكل","print":"🖨 طباعة / حفظ PDF","crumb":"‹ ألعاب اختراق التفكير الناقد","colActivity":"النشاط","colArea":"المجال الدراسي","colTeks":"المواءمة مع TEKS","colSkill":"مهارة التفكير الناقد","colClear":"خطوات CLEAR","colConn":"كيف يرتبط بـ CLEAR","origTag":"أصلي","language":"اللغة","footer":"ألعاب اختراق التفكير الناقد · مرتبطة بعملية التفكير CLEAR وبمعايير المعرفة والمهارات الأساسية في تكساس (TEKS). يشير الحرف المحدّد بإطار إلى خطوة CLEAR الأساسية لكل نشاط."},"clear":{"C":{"name":"الادّعاء","q":"ما الذي يُقال بالضبط؟"},"L":{"name":"العدسة","q":"ما الافتراضات التي أحملها معي؟"},"E":{"name":"الدليل","q":"ما الذي يدعم الادّعاء؟"},"A":{"name":"البدائل","q": الفائدة (E)، ويفكّرون في أي ترتيب يناسب فعلاً (A)، ويعيدون تجميع الوصفة لفتح المطبخ (R).","g35-ela-context":"يستنتج الطلاب معنى كلمة كادّعاء قابل للاختبار (C)، ويجمعون قرائن السياق المحيطة كإثبات (E)، ويختارون من بين المرادفات/المعاني المحتملة (A).","g35-ss-mapskills":"يُجبر القفل 5 (ثق بالخريطة لا بنفسك) الطلاب على مراجعة افتراضاتهم (L)، والاعتماد على أدلة رموز الخريطة (E)، والسير في المسار الصحيح (R).","g35-ss-economics":"يحصي الطلاب المؤن ويفرزون الاحتياجات مقابل الرغبات من سجلّات العربة، متجاهلين بطاقة خادعة (E)، ويوازنون الخيارات (A)، ويقرّرون كيفية صنع عصير الليمون (R).","g35-ss-government":"يستخدم الطلاب أدلة المكتب الحقيقية فقط ويرفضون الملاحظة المتبقّية (E)، ويحدّدون من يقرّر وكيف يُسنّ القانون كادّعاءات قابلة للاختبار (C)، ويفتحون قاعة البلدية (R).","g35-ss-texas":"يقرأ الطلاب بطاقات أدلة تكساس ويرصدون البطاقة الخادعة (E)، ويميّزون الرموز الحقيقية عن عناصر التشتيت (A)، ويرتّبون الخط الزمني لتحرير المعروضة (R).","g68-sci-cells":"يثبت الطلاب ما إذا كانت Specimen X خلية نباتية أم حيوانية كادّعاء قابل للاختبار (C)، ويفرزون بطاقات الأدلة المفيدة من عديمة الفائدة (E)، ويستبعدون نوع الخلية الآخر (A).","g68-sci-watercycle":"يستبعد القفل 3 المشتبه بهم (A) ويحتفظ القفل 4 بالأدلة الحقيقية فقط (E) لإثبات سبب انخفاض منسوب البحيرة (C) وتتبّع السبب الحقيقي (R).","g68-sci-forces":"يحسب الطلاب القوة المحصّلة من سجلّات المستشعر ويرفضون طُعم الثرثرة (E)، ويقرّرون أي قانون تفعّل (A)، ويُدخلون الرموز لتحرير عناصر التحكّم (R).","g68-sci-ecosystems":"يتتبّع الطلاب الطاقة ويفرزون المنتِجات باستخدام الأدلة الميدانية (E)، ثم يجدون السبب الحقيقي لتراجع الصقور مقابل تفسيرات أخرى (A) كادّعاء قابل للاختبار (C).","g68-ela-authorspurpose":"يثبت الطلاب غرض كل وثيقة من كلماتها (C)، ويتجاهلون الصفحة عديمة الفائدة ويستشهدون بأدلة الترفيه (E)، ويختارون من بين الأغراض المتنافسة (A).","g68-ela-theme":"يسمّي الطلاب الفكرة المحورية لا الموضوع ويستنتجون بدلاً من التلخيص (C)، ويعتمدون على ما تثبته البطاقات بدلاً من الافتراضات (L)، ويُسقطون الطُعم مع إحصاء الأدلة الحقيقية (E).","g68-ela-argument":"يسمّي الطلاب الجاني كادّعاء (C)، ويحتفظون فقط بالإثبات ويرفضون البطاقة عديمة الفائدة (E)، ويستبعدون الأندية الأخرى (A)، ويرتّبون الاستدلال لبناء القضية (R).","g68-ela-figurative":"يحدّد الطلاب كل أداة بلاغية كادّعاء قابل للاختبار (C)، ويحصون التشبيهات ويختارون الأدلة المفيدة (E)، ويميّزون الاستعارة عن التشبيه والأدوات الأخرى (A).","g68-ss-sources":"يفرز الطلاب المصادر الأولية عن المصادر الثانوية ويحصون أدلة الموثوقية (E)، ويختبرون ما إذا كانت اليوميات أصيلة (C)، ويوازنون الجدارة بالثقة (A)، ويرتّبون المصادر (R).","g68-ss-texashistory":"يرتّب الطلاب أحداث الثورة ويحصون المعارك باستخدام ما تثبته الوثائق فقط (E)، ويحدّدون الأثر الحاسم بين الأسباب (A)، ويفتحون الأرشيف (R).","g68-ss-economics":"يقرأ الطلاب سجلّات الكشك ويتجاهلون طُعم الخربشة (E)، ويوازنون الندرة وتكلفة الفرصة مقابل البدائل (A)، ويتنبّأون بالسعر لفتح الصندوق (R).","g68-ss-constitution":"يحصي الطلاب السلطات ويطابقون الوظائف من الأدلة الدستورية (E)، ويختبرون ما إذا كان إجراء ما ينتهك الدستور (C)، ويتصرّفون برصد الانتهاكات (R).","g912-sci-genetics":"يستخدم الطلاب أدلة مربّع Punnett (E) لاختبار براءة المربّي (C)، ويوازنون تفسيرات بديلة للنسب (A)، ويصدرون حكمًا (R).","g912-sci-periodic":"يصنّف الطلاب كأسًا ويرتّبون اتجاهًا باستخدام الأدلة الموثوقة فقط، رافضين البطاقة المهملة (E)، ويسمّون الضابط مقابل المتغيّرات (A)، ويعيدون فتح المختبر (R).","g912-sci-energy":"يحسب الطلاب السرعة ومقايضات الطاقة من بيانات المستشعر ويحتفظون بالأدلة الحقيقية فقط (E)، ويسمّون القانون كادّعاء قابل للاختبار (C)، ويحرّرون المكابح (R).","g912-sci-expdesign":"يعزل الطلاب السبب والنتيجة كفرضية (C)، ويقرأون ملاحظات المختبر بحثًا عن إثبات (E)، ويحدّدون المتغيّرات المضبوطة والمجموعة الضابطة مقابل العوامل المربكة (A).","g912-ela-rhetoric":"يكشف الطلاب المناشدات العاطفية (pathos) مقابل المنطقية، مُبرزين كيف تؤثّر فيهم النبرة (L)، ويحتفظون بأدلة logos فقط (E)، ويقارنون أنواع المناشدة (A).","g912-ela-fallacies":"يثبت الطلاب أي مغالطة يرتكبها كل حجاج كادّعاء قابل للاختبار (C)، ويرون كيف تتلاعب الهجمات بالتحيّز (L)، ويرفضون طُعم القائمة (E)، ويميّزون الحيل المتشابهة (A).","g912-ela-sources":"يختبر الطلاب ما إذا كانت الدراسة المنتشرة موثوقة (C)، ويعزلون المصادر الضعيفة ويحصون القرائن الرديئة (E)، ويرتّبون البدائل (A)، ويتحقّقون بالترتيب الصحيح (R).","g912-ela-tone":"يسمّي الطلاب موقف الكاتب وتحوّله (L)، ويستنتجون النبرة كادّعاء قابل للاختبار بدلاً من شعور مصرّح به (C)، ويستشهدون بكلمات الأجواء كدليل (E).","g912-ss-government":"يستخدم الطلاب الأدلة الدستورية (E) لاختبار ما إذا كان إجراء رسمي مشروعًا (C)، ويتصرّفون بتطبيق ضوابط مثل تجاوز حق النقض وحقوق المتّهم (R).","g912-ss-economics":"يقرأ الطلاب بيانات الدفتر لإثبات سبب ارتفاع الأسعار (C, E)، ويسمّون تكلفة الفرصة، ويوازنون التفسيرات الاقتصادية المتنافسة لقفزة السعر (A).","g912-ss-history":"يرصد الطلاب الطُعم ويحصون حالات الرفض من الأدلة (E)، ويتركون الأثر الورقي لا التواريخ المحفوظة يقرّر (L)، ويجدون السبب الجذري بين البدائل (A)، ويثبتون الادّعاء (C).","g912-ss-geography":"يختبر الطلاب ادّعاء اللجنة بأن القناة أنقذت المنطقة (C)، ويفرزون النتائج الحقيقية عن الطُعم (E)، ويوازنون أسبابًا أخرى (A)، ويصدرون حكمًا (R).","orig-g35-lunchroom":"يطابق الطلاب الصواني باستخدام ما تثبته القرائن فقط ويتجاهلون طُعم الكلب الضائع (E)، ويقارنون حساسية بصينية لاستبعاد الإجابات الخاطئة (A, C)، ويصلون إلى المطابقة الصحيحة (R).","orig-g68-signalcheck":"دورة CLEAR الكاملة: اختبار ادّعاء منتشر (C)، ومقاومة تحيّز الاستعجال/العاطفة (L)، وفرز المصادر القوية مقابل الضعيفة (E)، وتتبّعه حتى أصول بديلة (A)، وتقرير ما إذا كان يجب مشاركته (R).","orig-g912-labreport":"يختبر الطلاب ادّعاء «دراسة معجزة» (C)، ويحكمون على قوة الأدلة مثل صِغَر حجم العيّنة (E)، ويطالبون بمجموعة ضابطة ويرفضون اعتبار الارتباط سببية (A)، ويصدرون حكم مراجعة الأقران (R)."}},"ur":{"chrome":{"eyebrow":"ربط رہنما · TEKS اور CLEAR","h1":"سرگرمی کا ربط","lead":"جماعت کے درجے اور مضمون کے شعبے کے لحاظ سے ہر بریک آؤٹ، اس کی TEKS سے ہم آہنگی، وہ تنقیدی سوچ کی مہارت جو یہ پروان چڑھاتا ہے، اور یہ CLEAR سوچ کے عمل سے کیسے مطابقت رکھتا ہے — وہ 5 مرحلوں پر مشتمل تنقیدی سوچ کی فہرستِ جانچ جس کی طلبہ مشق کرتے ہیں۔","legendTitle":"CL const CLR = DATA.clear; const CLRC = Object.fromEntries(CLR.map(c=>[c.k,c.color]));
let lang = 'en';

function chip(k, primary){
  const cls = 'cchip' + (k===primary?' primary':'');
  const nm = (T().clear[k]||{}).name || k;
  return '<span class="'+cls+'" style="background:'+CLRC[k]+'" title="'+nm+'">'+k+'</span>';
}
function T(){ return DATA.i18n[lang] || DATA.i18n.en; }
function title(a){ return a.titles[lang] || a.titles.en; }
function subjLabel(key){ const s=T().subjects; return (s&&s[key]) || key; }
function skill(a){ const s=T().skills; return (s&&s[a.skillKey]) || (DATA.i18n.en.skills[a.skillKey]||''); }
function conn(a){ const c=T().connections; return (c&&c[a.slug]) || DATA.i18n.en.connections[a.slug] || ''; }
function href(a){ return a.href.replace('LANG', lang); }
function band(gk){ const b=DATA.bands[lang]||DATA.bands.en; return (b&&b[gk])||DATA.bands.en[gk]; }

function render(){
  const t = T();
  const L = DATA.langs.find(x=>x.code===lang);
  document.documentElement.lang = lang;
  document.documentElement.dir = L.dir;
  // chrome
  document.getElementById('eyebrow').textContent = t.chrome.eyebrow;
  document.getElementById('h1').textContent = t.chrome.h1;
  document.getElementById('lead').textContent = t.chrome.lead;
  document.getElementById('crumb').textContent = t.chrome.crumb;
  document.getElementById('filterLabel').textContent = t.chrome.filterLabel;
  document.getElementById('fAll').textContent = t.chrome.all;
  document.getElementById('printBtn').textContent = t.chrome.print;
  document.getElementById('footer').textContent = t.chrome.footer;
  // legend
  let leg = '<div class="title">'+t.chrome.legendTitle+'</div>';
  for(const c of CLR){ const s=t.clear[c.k]; leg += '<div class="leg"><span class="cchip big" style="background:'+c.color+'">'+c.k+'</span><div><b>'+s.name+'</b><span class="legq">'+s.q+'</span></div></div>'; }
  document.getElementById('legend').innerHTML = leg;
  // language buttons
  const lb = document.getElementById('langbar');
  lb.innerHTML = DATA.langs.map(x=>'<button data-lang="'+x.code+'"'+(x.code===lang?' class="active"':'')+' lang="'+x.code+'">'+x.label+'</button>').join('');
  lb.querySelectorAll('button').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;render();applyFilter();});
  // sections/tables
  let html='';
  for(const g of DATA.grades){
    const rows = DATA.acts.filter(a=>a.grade===g.key).map(a=>{
      const color = DATA.subjectColors[a.subjectKey]||'#102a54';
      return '<tr data-subj="'+a.subjectKey+'">'+
        '<td class="act"><a href="'+href(a)+'">'+a.icon+' '+esc(title(a))+'</a>'+(a.isOrig?' <span class="orig">'+t.chrome.origTag+'</span>':'')+'</td>'+
        '<td><span class="subj" style="background:'+color+'">'+esc(subjLabel(a.subjectKey))+'</span></td>'+
        '<td class="teks">'+esc(a.teks)+'</td>'+
        '<td class="skill">'+esc(skill(a))+'</td>'+
        '<td class="clear">'+a.steps.slice().sort((x,y)=>'CLEAR'.indexOf(x)-'CLEAR'.indexOf(y)).map(k=>chip(k,a.primary)).join('')+'</td>'+
        '<td class="conn">'+esc(conn(a))+'</td></tr>';
    }).join('');
    html += '<h2 id="'+g.key+'">'+esc(band(g.key))+'</h2>'+
      '<div class="tablewrap"><table><thead><tr>'+
      '<th>'+t.chrome.colActivity+'</th><th>'+t.chrome.colArea+'</th><th>'+t.chrome.colTeks+'</th>'+
      '<th>'+t.chrome.colSkill+'</th><th>'+t.chrome.colClear+'</th><th>'+t.chrome.colConn+'</th>'+
      '</tr></thead><tbody>'+rows+'</tbody></table></div>';
  }
  document.getElementById('sections').innerHTML = html;
}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

let curFilter='all';
function applyFilter(){
  document.querySelectorAll('.filterbtn').forEach(b=>b.classList.toggle('active', b.dataset.subj===curFilter));
  document.querySelectorAll('tbody tr').forEach(tr=>{
    tr.style.display = (curFilter==='all' || tr.dataset.subj===curFilter) ? '' : 'none';
  });
  document.querySelectorAll('h2').forEach(h=>{
    const tbl=h.nextElementSibling; const any=[...tbl.querySelectorAll('tbody tr')].some(tr=>tr.style.display!=='none');
    h.style.display=any?'':'none'; tbl.style.display=any?'':'none';
  });
}
document.addEventListener('click', e=>{ const b=e.target.closest('.filterbtn'); if(b){ curFilter=b.dataset.subj; applyFilter(); } });
render(); applyFilter();
</script>
