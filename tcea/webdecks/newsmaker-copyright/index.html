<script>
const SOURCES={co:'https://www.copyright.gov/help/faq/faq-fairuse.html',harvard:'https://ogc.harvard.edu/pages/copyright-and-fair-use',cc:'https://wiki.creativecommons.org/wiki/Recommended_practices_for_attribution',ai:'https://www.copyright.gov/ai/'};
const SLIDES=[
{bg:'navy',title:'Title',html:`<div class="content"><div class="kicker">Copyright-Safe Curation</div><h1>Newsletter AI assisted creation</h1><p class="lead">A practical WebDeck for keeping curated educator newsletters useful, ethical, and lower risk.</p><div class="rule"></div><span class="pill">Short summaries</span><span class="pill">Clear links</span><span class="pill">Original visuals</span></div><div class="motif">${motif()}</div>`,notes:`This deck is about a practical copyright approach for Newsletter AI assisted creation. The main point is simple: using Gen AI to help curate and write a newsletter can be lower risk than republishing articles, but only if the workflow stays original, selective, and clearly linked to the source. I want the audience to leave with guardrails they can use the same day: summarize in their own words, add educator-focused commentary, avoid article images, and treat paywalled material with extra care. The deck starts with the risk frame, then moves into safer choices and a checklist.`},
{bg:'light',title:'Risk frame',html:`<div class="content grid two"><div><div class="kicker">Core idea</div><h2>Lower risk does not mean risk-free</h2><p class="lead">The safest newsletter does not replace the original source. It points readers back to it.</p><p>Newsletter AI assisted creation works best as commentary, curation, and practical interpretation for educators.</p></div><div class="card gold"><div class="bigstat">4</div><p><b>Copyright pressure points</b></p><ul><li>Copied expression</li><li>Article images</li><li>Paywalled detail</li><li>Close paraphrasing</li></ul></div></div>`,notes:`This slide frames the whole conversation. Newsletter AI assisted creation is not the same as reposting someone else’s work. It can be a safer pattern because the newsletter can point readers to the original article while adding a practical educator lens. But that safety depends on choices. If the newsletter copies too much expression, uses the publisher’s image, or summarizes a paywalled article so thoroughly that readers do not need the original, the risk goes up. I would use this slide to move the audience away from a yes-or-no mindset and toward a workflow mindset.`},
{bg:'light',title:'Fair use basics',html:`<div class="content"><div class="kicker">Guardrail one</div><h2>Summarize, link, and keep it limited</h2><div class="grid three"><div class="card"><div class="icon">✍️</div><h3>Use original words</h3><p>Write short summaries from your own understanding, not copied structure or phrasing.</p></div><div class="card"><div class="icon">🔗</div><h3>Send readers out</h3><p>Make the linked source the place readers go for the full context.</p></div><div class="card"><div class="icon">⚖️</div><h3>Avoid magic numbers</h3><p>There is no fixed safe word count or percentage for fair use.</p></div></div><p class="source">Source: <a href="${SOURCES.co}" target="_blank" rel="noopener">U.S. Copyright Office fair use FAQ</a></p></div>`,notes:`This is the first operational rule. Short, original summaries with links are usually the safer part of the newsletter workflow. The U.S. Copyright Office is clear that fair use can support limited use for purposes such as commentary, criticism, news reporting, teaching, and scholarly reporting, but it also says there is no fixed number of words or percentage that is automatically safe. That matters because many people want a rule like “quote fifty words and you are fine.” Copyright does not work that way. The practical move is to keep summaries short, add your own educator-focused interpretation, and make the source link do real work.`},
{bg:'navy',title:'Transformative use',html:`<div class="content grid two"><div><div class="kicker">Guardrail two</div><h2>Make the newsletter do new work</h2><p class="lead">The issue should help educators understand why the source matters, not spare them from reading it.</p></div><div class="card darkcard"><p class="quote">Strong curation adds a theme, a teaching connection, and a practical takeaway.</p><p class="muted">Weak curation repeats the article in a shorter package.</p></div></div><div class="motif">${motif()}</div>`,notes:`This slide gets at the difference between curation and substitution. A strong issue is organized around a useful theme: assessment, instructional coaching, data privacy, classroom Gen AI, or another educator-facing problem. It explains why the source matters, what to watch for, and how the idea might show up in practice. That is new work. A weak issue just compresses articles into convenient digests. That can drift into replacement, especially when the source is paid or subscriber-only. My recommendation is to make every item answer one extra question: what does this mean for an educator trying to make a decision?`},
{bg:'light',title:'Image risk',html:`<div class="content grid two"><div><div class="kicker">Biggest risk</div><h2>Article images are the danger zone</h2><p class="lead">Text summaries get most of the attention, but copied visuals often create the cleaner copyright problem.</p><div><span class="pill safe">Use placeholders</span><span class="pill safe">Create original banners</span><span class="pill safe">Use licensed media</span></div></div><div class="card"><h3>Be careful with</h3><ul><li>Publisher images</li><li>Article screenshots</li><li>Stock photos embedded in posts</li><li>Charts, graphics, and diagrams</li></ul><p class="source">Source: <a href="${SOURCES.cc}" target="_blank" rel="noopener">Creative Commons attribution practices</a></p></div></div>`,notes:`This is the part I would emphasize most. People often worry about the written summary, then casually reuse the article image at the top of the newsletter. That can be a bigger problem. Images may be licensed separately, owned by a photographer, pulled from a stock library, or used by the publisher under terms that do not transfer to you. The safer workflow is simple: use placeholders while drafting, create your own feature image or visual summary, and use Creative Commons or public-domain media only when the license allows it. When using Creative Commons material, include the title, author, source, and license when that information is available.`},
{bg:'light',title:'Generated visuals',html:`<div class="content"><div class="kicker">Generated visuals</div><h2>Useful, but ownership is nuanced</h2><div class="grid four"><div class="card"><h3>Good use</h3><p>Create theme-based banners and simple visual summaries.</p></div><div class="card"><h3>Human input</h3><p>Protectable value may come from selection, editing, arrangement, and writing.</p></div><div class="card"><h3>Tool terms</h3><p>Check the image tool’s usage terms before publishing.</p></div><div class="card"><h3>Avoid</h3><p>Do not imitate living artists, publisher styles, copyrighted characters, or logos.</p></div></div><p class="source">Source: <a href="${SOURCES.ai}" target="_blank" rel="noopener">U.S. Copyright Office: Copyright and Artificial Intelligence</a></p></div>`,notes:`Generated images can reduce the need to copy publisher artwork. That is useful. The nuance is ownership. Current U.S. Copyright Office guidance centers copyright protection on human authorship, so a purely generated image may not receive the same protection as a human-authored work. In practice, that does not mean you cannot use generated images. It means you should be honest about what you can claim. Your human writing, editing, issue structure, selection, and arrangement may still carry creative value. I would also avoid prompts that imitate a publication’s visual style or a living artist. The safer prompt is theme-based, original, and classroom-appropriate.`},
{bg:'light',title:'Attribution limit',html:`<div class="content grid two"><div><div class="kicker">Common misconception</div><h2>Attribution helps. It is not a shield.</h2><p class="lead">Links and author names support transparency. They do not replace permission, a license, or a fair-use rationale.</p></div><div class="card gold"><h3>Use attribution for</h3><ul><li>Reader trust</li><li>Source discovery</li><li>Professional ethics</li><li>Research trails</li></ul><p class="muted">Still keep the copied material limited.</p></div></div>`,notes:`This slide clears up a common misunderstanding. Attribution is good practice. It shows readers where the idea came from, helps them follow the source trail, and gives credit to the author or publisher. But attribution does not automatically make copying lawful. A newsletter can be perfectly attributed and still copy too much. That is why the workflow needs both attribution and restraint. The question is not only “did I link to the author?” The better question is “did I use only what I needed, and did I add something meaningful for my readers?” That is the safer habit.`},
{bg:'navy',title:'Higher caution',html:`<div class="content"><div class="kicker">Use extra caution</div><h2>Public web articles are not the same as paid sources</h2><div class="grid three"><div class="card darkcard"><h3>Lower risk</h3><p>Public articles, short original summaries, clear outbound links.</p></div><div class="card darkcard"><h3>Higher risk</h3><p>Paid newsletters, subscriber reports, database articles, books, and commercial PDFs.</p></div><div class="card darkcard"><h3>Safer move</h3><p>Briefly describe the source, link to the landing page, and avoid quote-heavy summaries.</p></div></div></div><div class="motif">${motif()}</div>`,notes:`Here I would make the distinction concrete. A public article with a short original summary and a clear link is one thing. A subscriber-only newsletter, a paid research report, a database article, or a book chapter is another. The more restricted the source, the more careful the newsletter should be. That does not mean you can never mention these sources. It means you should avoid turning them into a replacement. For paid or restricted material, I would keep the description lighter, avoid quotes unless they are essential, and link to the source landing page rather than reproducing the parts that carry the value.`},
{bg:'light',title:'Checklist',html:`<div class="content"><div class="kicker">Decision checklist</div><h2>Lower-risk versus higher-risk choices</h2><div class="tablewrap"><table><thead><tr><th>Area</th><th>Lower-risk practice</th><th>Higher-risk practice</th></tr></thead><tbody><tr><td>Article text</td><td>Original summaries and commentary</td><td>Copied paragraphs or close paraphrases</td></tr><tr><td>Quotes</td><td>Short, necessary excerpts</td><td>Long excerpts or repeated quotes</td></tr><tr><td>Images</td><td>Placeholders, original, licensed, or public-domain visuals</td><td>Copied article images or unlicensed screenshots</td></tr><tr><td>Paywalled content</td><td>Brief description and link</td><td>Detailed replacement summary</td></tr><tr><td>Newsletter value</td><td>Analysis and educator takeaways</td><td>Repackaged source articles</td></tr></tbody></table></div></div>`,notes:`This slide turns the guidance into a quick review tool. I would use it as the working checklist for each issue. Look at the text first: is the summary genuinely yours, or is it hugging the source too closely? Look at quotes next: are they short and necessary, or are they doing the work the summary should do? Then check visuals. If the image came from the article, pause. Finally, ask whether the issue adds practical educator value. If the answer is no, the newsletter is drifting toward republishing. If the answer is yes, the workflow is in safer territory.`},
,
{bg:'light',title:'Rubric: source and originality',html:`<div class="content"><div class="kicker">Rubric, part one</div><h2>Score the source use first</h2><div class="tablewrap"><table><thead><tr><th>Category</th><th>4: Strong</th><th>3: Acceptable</th><th>2: Revise</th><th>1: Risky</th></tr></thead><tbody><tr><td>Source use</td><td>Direct original links, author or publisher named</td><td>Most links and attribution are clear</td><td>Some vague or indirect links</td><td>Missing links or unclear sourcing</td></tr><tr><td>Originality</td><td>Original summaries and commentary</td><td>Mostly rewritten, with minor close phrasing</td><td>Compressed paraphrase of source</td><td>Copies phrasing, order, or argument closely</td></tr><tr><td>Transformative value</td><td>Adds educator lens and practical implications</td><td>Adds some useful takeaways</td><td>Mostly summarizes</td><td>Replaces the need to read the source</td></tr><tr><td>Quote discipline</td><td>No quotes or only short needed excerpts</td><td>Short, attributed quotes</td><td>Repeated short quotes</td><td>Long excerpts or copied passages</td></tr><tr><td>Paywall caution</td><td>Brief description and link only</td><td>Some summary, not enough to replace source</td><td>Detailed summary of restricted content</td><td>Recreates value of paid content</td></tr></tbody></table></div></div>`,notes:`This rubric starts with the parts that usually create the most trouble in a newsletter: source use, originality, transformation, quotes, and paywalled content. I would score these before looking at design or polish. A good issue should point directly to the original source, use its own wording, and add an educator lens that the source did not already provide. The key question is simple: does this entry help a reader decide whether to visit the source, or does it replace the source? If it replaces the source, the issue needs revision before it goes out.`},
{bg:'light',title:'Rubric: visuals and review',html:`<div class="content"><div class="kicker">Rubric, part two</div><h2>Then check images, facts, and human judgment</h2><div class="tablewrap"><table><thead><tr><th>Category</th><th>4: Strong</th><th>3: Acceptable</th><th>2: Revise</th><th>1: Risky</th></tr></thead><tbody><tr><td>Image safety</td><td>Original, licensed, public-domain, or placeholder visuals</td><td>Mostly safe, attribution could improve</td><td>Image origin unclear</td><td>Article images or screenshots used without permission</td></tr><tr><td>Accuracy check</td><td>Claims verified against sources</td><td>Most factual claims checked</td><td>Strong claims need checking</td><td>High-stakes claims published unchecked</td></tr><tr><td>Human authorship</td><td>Clear human selection, editing, and judgment</td><td>Human review likely, but not obvious</td><td>Gen AI tone dominates</td><td>Fully automated publication</td></tr><tr><td>Reader usefulness</td><td>Clear theme, concise entries, practical takeaways</td><td>Useful but uneven</td><td>Too broad or repetitive</td><td>Generic or confusing</td></tr><tr><td>Disclosure and ethics</td><td>Clear note about summaries, links, and images</td><td>Attribution present, but no note</td><td>Partial transparency</td><td>Weak attribution and no disclosure</td></tr></tbody></table></div></div>`,notes:`The second half of the rubric checks what can be easy to miss after the writing looks finished. Images deserve special attention because a copied article image can create more risk than a short text summary. Accuracy also matters, especially for health, law, finance, student data, and product claims. The human authorship row is there because Newsletter AI assisted creation should still show human judgment: selecting sources, arranging the issue, editing the commentary, and deciding what belongs. If the issue reads like a pasted machine digest, the workflow is not doing enough editorial work yet.`},
{bg:'light',title:'Rubric scoring guide',html:`<div class="content"><div class="kicker">Scoring guide</div><h2>Use the score to decide what happens next</h2><div class="grid two"><div class="card gold"><div class="bigstat">40</div><h3>Maximum score</h3><p>Ten categories. Four points each. The number is useful, but the individual weak rows matter more.</p></div><div class="card"><div class="tablewrap"><table><thead><tr><th>Total</th><th>Decision</th></tr></thead><tbody><tr><td>36 to 40</td><td>Publish-ready</td></tr><tr><td>30 to 35</td><td>Good with light edits</td></tr><tr><td>24 to 29</td><td>Needs review</td></tr><tr><td>Below 24</td><td>Do not publish yet</td></tr></tbody></table></div></div></div><div class="card darkcard" style="margin-top:1rem"><h3>No-go rule</h3><p>Do not publish if any category scores 1. Revise every category that scores 2 before the issue goes live.</p></div></div>`,notes:`This scoring guide keeps the rubric practical. The total score gives a quick read, but I would not let a high total hide a serious single-category problem. One copied image, one unsupported health claim, or one detailed replacement summary of a subscriber-only source can be enough to stop publication. That is why the no-go rule matters: any score of one means the issue pauses. Any score of two gets revised. This keeps the rubric from becoming a paperwork exercise. It turns it into a publishing gate that protects the writer, the organization, the sources, and the reader.`},
{bg:'navy',title:'Project instructions',html:`<div class="content"><div class="kicker">Project instructions</div><h2>Build each issue for copyright-friendliness</h2><div class="grid two"><div class="card darkcard"><h3>Required workflow</h3><ul><li>Use direct canonical links to original sources</li><li>Write short original summaries in a new structure</li><li>Add educator-focused commentary and practical takeaways</li><li>Verify factual claims against the linked source</li><li>Score the issue with the rubric before publishing</li></ul></div><div class="card darkcard"><h3>Hard limits</h3><ul><li>Do not copy article images unless licensed or permitted</li><li>Do not closely paraphrase paragraphs or section structure</li><li>Do not make a paywalled source unnecessary to visit</li><li>Do not imitate a publication style, living artist, character, or logo</li><li>Do not publish if any rubric category scores 1</li></ul></div></div></div><div class="motif">${motif()}</div>`,notes:`This slide converts the rubric into project instructions. I would paste these into the newsletter project so they shape every issue before drafting begins. The first column tells the tool and the editor what the workflow should produce: direct source links, original summaries, educator commentary, checked claims, and a rubric score. The second column sets hard limits. Those are the boundaries that reduce copyright and trust risk. The most important one is the paywall rule. A newsletter can point to a restricted source, but it should not recreate the value people normally need a subscription or license to access.`},
{bg:'light',title:'Issue note',html:`<div class="content"><div class="kicker">Copy-ready language</div><h2>Add a copyright note to each issue</h2><div class="card darkcard"><p class="quote">This newsletter provides original commentary and summaries of publicly available sources for educational and informational purposes. Readers are encouraged to visit the linked sources for the full context. Article images are represented with placeholders unless separately licensed or created for this issue.</p></div><p class="muted">Use this as a starting point, then adjust it to match the actual sources and visuals used in the issue.</p></div>`,notes:`This is copy-ready wording for the bottom of each issue. It does not solve copyright by itself, and I would not present it as legal protection. Its value is practical. It tells readers what the newsletter is trying to do: provide original commentary, summarize public sources, and send readers back for full context. It also documents the image rule, which is where many newsletters get sloppy. I would adapt the note if the issue includes licensed images, Creative Commons images, or a paid source that is only described briefly. The note should match the issue, not pretend the workflow was safer than it was.`},
{bg:'navy',title:'Bottom line',html:`<div class="content"><div class="kicker">Bottom line</div><h2>Use the safest pattern</h2><p class="lead">Short original summary + practical educator commentary + clear link + original or licensed visuals.</p><div class="rule"></div><div class="grid four"><div class="card darkcard"><h3>Curated</h3><p>Organized around a useful issue theme.</p></div><div class="card darkcard"><h3>Transformative</h3><p>Adds interpretation and classroom relevance.</p></div><div class="card darkcard"><h3>Attributed</h3><p>Links readers to the original source.</p></div><div class="card darkcard"><h3>Image-cautious</h3><p>Avoids copied article artwork.</p></div></div></div><div class="motif">${motif()}</div>`,notes:`This closing slide gives the pattern I would want people to remember. Newsletter AI assisted creation is reasonably sound when it stays curated, transformative, attributed, and careful with images. The biggest risks are copied article images, excessive quoting, close paraphrasing, and detailed summaries of paid or subscriber-only content. The safest rhythm is a short original summary, followed by practical educator commentary, a clear link, and an original or licensed visual. That is easy to audit, easy to explain, and useful for readers. It also keeps the newsletter from becoming a substitute for the original work.`},
{bg:'light',title:'Sources',html:`<div class="content"><div class="kicker">Sources</div><h2>Reference links</h2><div class="grid two"><div class="card"><h3>Fair use</h3><p><a href="${SOURCES.co}" target="_blank" rel="noopener">U.S. Copyright Office fair use FAQ</a></p><p><a href="${SOURCES.harvard}" target="_blank" rel="noopener">Harvard Office of General Counsel: Copyright and Fair Use</a></p></div><div class="card"><h3>Images and AI</h3><p><a href="${SOURCES.cc}" target="_blank" rel="noopener">Creative Commons recommended attribution practices</a></p><p><a href="${SOURCES.ai}" target="_blank" rel="noopener">U.S. Copyright Office: Copyright and Artificial Intelligence</a></p></div></div></div>`,notes:`This final slide keeps the source trail visible. I would not spend much presentation time here unless the audience asks for the legal basis. The important point is that the deck is grounded in public guidance: the U.S. Copyright Office for fair use and AI-related copyright materials, Creative Commons for attribution practices, and Harvard’s Office of General Counsel for plain-language fair use context. These sources do not turn the deck into legal advice, but they do give educators a reasonable starting point for building a careful newsletter workflow. From here, the next step is to review one real issue against the checklist.`}
];
function motif(){return `<svg viewBox="0 0 200 200" aria-hidden="true"><circle cx="100" cy="100" r="88" fill="none" stroke="currentColor" stroke-width="10"/><path d="M55 108h90M75 78h70M75 138h50" stroke="currentColor" stroke-width="12" stroke-linecap="round"/><circle cx="48" cy="108" r="10" fill="currentColor"/><circle cx="60" cy="78" r="7" fill="currentColor"/><circle cx="60" cy="138" r="7" fill="currentColor"/></svg>`}
let idx=0,notesOpen=false,helpOpen=false,bc=null,audienceWin=null,presenterMode=false,startTime=Date.now();
const deck=document.getElementById('deck'),dots=document.getElementById('dots');
function render(){deck.innerHTML=SLIDES.map((s,i)=>`<section class="slide ${s.bg} ${i===idx?'active':''}" data-i="${i}">${s.html}</section>`).join('');dots.innerHTML=SLIDES.map((_,i)=>`<button class="dot ${i===idx?'active':''}" data-i="${i}" aria-label="Slide ${i+1}"></button>`).join('');document.getElementById('counter').textContent=`${idx+1}/${SLIDES.length}`;document.getElementById('progress').style.width=`${((idx+1)/SLIDES.length)*100}%`;document.getElementById('notesText').innerHTML=`<p>${SLIDES[idx].notes}</p>`;location.hash=String(idx+1);if(presenterMode)updatePresenter();if(bc)bc.postMessage({type:'goto',idx});}
function go(n){idx=Math.max(0,Math.min(SLIDES.length-1,n));render()}function next(){go(idx+1)}function prev(){go(idx-1)}
function toggleNotes(force){notesOpen=force??!notesOpen;document.getElementById('notesPanel').classList.toggle('open',notesOpen)}function toggleHelp(force){helpOpen=force??!helpOpen;document.getElementById('help').classList.toggle('open',helpOpen)}
function updatePresenter(){document.body.classList.toggle('presenterOn',presenterMode);document.getElementById('pcounter').textContent=`Slide ${idx+1} of ${SLIDES.length}`;document.getElementById('pcurrent').innerHTML=`<div style="transform:scale(.55);transform-origin:top left;width:180%;height:60vh;overflow:hidden">${SLIDES[idx].html}</div>`;document.getElementById('pnotes').innerHTML=`<p>${SLIDES[idx].notes}</p>`;document.getElementById('pnext').textContent=SLIDES[idx+1]?.title||'End of deck'}
function openPresenter(){presenterMode=true;bc=new BroadcastChannel('newsletter-webdeck');audienceWin=window.open(location.href.replace(location.hash,'')+'#'+(idx+1),'audienceDeck','popup=yes,width=1200,height=800');updatePresenter();}
function fullscreen(){if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()}
window.addEventListener('keydown',e=>{if(['ArrowRight','ArrowDown',' '].includes(e.key)){e.preventDefault();next()}else if(['ArrowLeft','ArrowUp'].includes(e.key)){e.preventDefault();prev()}else if(e.key==='Home'){go(0)}else if(e.key==='End'){go(SLIDES.length-1)}else if(e.key.toLowerCase()==='n'){toggleNotes()}else if(e.key.toLowerCase()==='h'||e.key==='?'){toggleHelp()}else if(e.key.toLowerCase()==='p'){openPresenter()}else if(e.key.toLowerCase()==='f'){fullscreen()}});
document.getElementById('prev').onclick=prev;document.getElementById('next').onclick=next;document.getElementById('notesBtn').onclick=()=>toggleNotes();document.getElementById('helpBtn').onclick=()=>toggleHelp();document.getElementById('presentBtn').onclick=openPresenter;document.getElementById('fullBtn').onclick=fullscreen;dots.onclick=e=>{if(e.target.classList.contains('dot'))go(+e.target.dataset.i)};
deck.addEventListener('click',e=>{if(notesOpen||helpOpen||presenterMode||window.getSelection().toString())return;if(e.target.closest('a,button,#bar,#notesPanel,#help'))return;let x=e.clientX/window.innerWidth;if(x<.33)prev();else if(x>.66)next()});
let sx=0;deck.addEventListener('touchstart',e=>{sx=e.changedTouches[0].clientX},{passive:true});deck.addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>50){dx<0?next():prev()}},{passive:true});
window.addEventListener('hashchange',()=>{let n=parseInt(location.hash.slice(1),10);if(n&&n-1!==idx)go(n-1)});
try{let chan=new BroadcastChannel('newsletter-webdeck');chan.onmessage=e=>{if(e.data?.type==='goto'&&!presenterMode){idx=e.data.idx;render()}}}catch(e){}
setInterval(()=>{let s=Math.floor((Date.now()-startTime)/1000),m=Math.floor(s/60);document.getElementById('timer').textContent=`${String(m).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`},1000);
let start=parseInt(location.hash.slice(1),10);if(start)idx=Math.max(0,Math.min(SLIDES.length-1,start-1));render();
</script>
</body>
</html>
