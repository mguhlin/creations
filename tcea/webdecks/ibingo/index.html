<html lang="en">

<title>iBINGO Game Maker WebDeck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Inter:wght@400;500;700;800&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0A3476;--blue:#0d6dfd;--gold:#FCB040;--teal:#0e6b8a;--green:#4fbf26;--purple:#7c3aed;--orange:#f36b21;--ink:#11213b;--muted:#5b6b86;--paper:#f8fbff;--white:#ffffff;--line:#d9e4f5;--shadow:0 24px 60px rgba(10,52,118,.24);--bar-h:68px}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--navy);color:var(--ink);overflow:hidden}a{color:inherit}button{font:inherit}
#deck{position:relative;width:100vw;height:100vh;overflow:hidden;background:var(--paper)}.progress{position:fixed;top:0;left:0;height:5px;background:linear-gradient(90deg,var(--gold),var(--green),var(--blue));width:0;z-index:20;transition:width .25s ease}.slide{position:absolute;inset:0;padding:clamp(2rem,5vw,5.2rem) clamp(1.3rem,5.5vw,6rem) calc(var(--bar-h) + 2.4rem);display:flex;align-items:center;justify-content:center;overflow-y:auto;opacity:0;transform:translateX(3%);transition:opacity .25s ease,transform .25s ease;background:var(--paper)}.slide.active{opacity:1;transform:translateX(0);z-index:2}.slide.dark{background:radial-gradient(circle at 15% 10%,rgba(252,176,64,.25),transparent 28%),linear-gradient(135deg,#06214d 0%,#0A3476 58%,#061a3b 100%);color:var(--white)}.slide.hero{background:radial-gradient(circle at 86% 12%,rgba(252,176,64,.35),transparent 24%),radial-gradient(circle at 14% 80%,rgba(14,107,138,.45),transparent 24%),linear-gradient(135deg,#082c66,#0A3476 48%,#061633);color:var(--white)}.slide:before{content:"";position:absolute;inset:auto -5rem -10rem auto;width:24rem;height:24rem;border-radius:50%;border:3rem solid rgba(252,176,64,.12);pointer-events:none}.slide.light:before{border-color:rgba(10,52,118,.08)}
h1,h2,h3,p{margin-top:0}h1,h2{font-family:Fredoka,Inter,sans-serif;line-height:.94;letter-spacing:-.035em}h1{font-size:clamp(3.3rem,10vw,8.6rem);margin-bottom:1.1rem}h2{font-size:clamp(2.5rem,6.2vw,6rem);margin-bottom:1rem}h3{font-size:clamp(1.25rem,2vw,2rem);margin-bottom:.55rem}p,li{font-size:clamp(1rem,1.6vw,1.5rem);line-height:1.45}.lead{font-size:clamp(1.25rem,2.5vw,2.2rem);max-width:900px;line-height:1.25}.big{font-size:clamp(1.35rem,2.8vw,2.5rem);line-height:1.2;color:inherit}.eyebrow{font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--teal);font-size:clamp(.8rem,1vw,1rem);margin-bottom:.75rem}.gold{color:var(--gold)}
.hero-grid{display:grid;grid-template-columns:minmax(0,.82fr) minmax(360px,1.18fr);gap:clamp(1.5rem,4vw,4rem);align-items:center;width:100%;position:relative;z-index:1}.hero-copy{max-width:720px}.hero-img-wrap{background:rgba(255,255,255,.12);padding:.75rem;border:1px solid rgba(255,255,255,.24);border-radius:2rem;box-shadow:var(--shadow);transform:rotate(1deg)}.hero-img-wrap img{display:block;width:100%;border-radius:1.35rem}.chiprow,.note-strip{display:flex;gap:.7rem;flex-wrap:wrap;margin-top:1.5rem}.chiprow span,.note-strip span{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);color:#fff;padding:.6rem .85rem;border-radius:999px;font-weight:800}.note-strip span{background:#fff;color:var(--navy);border-color:var(--line);box-shadow:0 8px 24px rgba(10,52,118,.08)}
.two-col{display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,.78fr);gap:clamp(1.5rem,5vw,5rem);align-items:center;width:100%;position:relative;z-index:1}.two-col.weighted{grid-template-columns:minmax(0,.78fr) minmax(420px,1.22fr)}.stacked-card,.callout,.option-card,.grid-4>div,.stat-card,.browser{border-radius:1.5rem;padding:clamp(1.2rem,2vw,2rem);box-shadow:0 18px 50px rgba(10,52,118,.13);border:1px solid var(--line);background:#fff}.navy-card{background:var(--navy);color:#fff;border-color:rgba(255,255,255,.18)}.navy-card li,.navy-card p{color:#fff}.navy-card hr{border:0;border-top:1px solid rgba(255,255,255,.22);margin:1.2rem 0}ul,ol{padding-left:1.35em;margin:0}li+li{margin-top:.45rem}
.steps,.cards-3,.grid-4{display:grid;gap:1rem;margin-top:2rem}.steps{grid-template-columns:repeat(3,1fr)}.step{background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.20);border-radius:1.6rem;padding:2rem;color:#fff}.step span{display:inline-grid;place-items:center;width:3.2rem;height:3.2rem;border-radius:50%;background:var(--gold);color:#081b3b;font-weight:900;font-size:1.6rem;margin-bottom:1rem}.cards-3{grid-template-columns:repeat(3,1fr);width:min(1180px,100%)}.option-card{text-align:center}.option-card.featured{border-color:var(--gold);box-shadow:0 20px 70px rgba(252,176,64,.25)}.icon{font-family:Fredoka;font-size:clamp(2.2rem,4vw,4.2rem);color:var(--navy);background:#eef6ff;border-radius:1rem;padding:.8rem;margin-bottom:1rem}.under-note{margin:1.5rem auto 0;max-width:920px;color:var(--muted);text-align:center}.darkcards>div{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.2);color:#fff}.darkcards p{color:#fff}.center{text-align:center;width:100%;position:relative;z-index:1}.grid-4{grid-template-columns:repeat(4,1fr)}.grid-4 h3{color:var(--navy)}
.browser{overflow:hidden;padding:0;background:#071e45;color:#fff;border-color:#24497f}.browser-top{height:48px;background:#dfe8f7;color:#1a2c48;display:flex;align-items:center;gap:.5rem;padding:0 1rem;font-size:.95rem}.browser-top span{width:.75rem;height:.75rem;border-radius:50%;background:var(--orange)}.browser-top span:nth-child(2){background:var(--gold)}.browser-top span:nth-child(3){background:var(--green)}.browser-top b{margin-left:.7rem}pre{margin:0;padding:1.5rem;font-family:'Roboto Mono',monospace;font-size:clamp(1rem,1.7vw,1.45rem);line-height:1.55;color:#d9f3ff;white-space:pre-wrap}.statement-stat{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:3rem;align-items:center;width:100%;position:relative;z-index:1}.stat-card{text-align:center;background:#fff;color:var(--navy)}.stat{font-family:Fredoka;font-size:clamp(8rem,14vw,14rem);line-height:.8;color:var(--gold)}.mini-cards{display:grid;grid-template-columns:repeat(5,1fr);gap:1rem;width:min(900px,100%);margin:2rem auto 0;position:relative;z-index:1}.mini-cards div{background:#fff;color:var(--navy);border-radius:1rem;min-height:110px;display:grid;place-items:center;font-family:Fredoka;font-size:2.5rem;border:4px solid var(--gold);box-shadow:0 12px 30px rgba(0,0,0,.18)}.mini-cards small{font-family:Inter;font-size:1rem;color:var(--muted)}.callout{background:linear-gradient(135deg,var(--navy),#071d44);color:#fff;border-color:rgba(255,255,255,.2)}.callout p{color:#fff}.number-list li{font-size:clamp(1.15rem,2vw,1.7rem);font-weight:700}.closing{text-align:center;position:relative;z-index:1;max-width:1000px}.big-link{display:inline-flex;margin-top:1.8rem;background:var(--gold);color:#061633;text-decoration:none;border-radius:999px;padding:1rem 1.35rem;font-weight:900;font-size:clamp(1rem,1.5vw,1.3rem);box-shadow:0 14px 40px rgba(252,176,64,.32)}
.navbar{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);height:var(--bar-h);max-width:min(1120px,calc(100vw - 24px));width:max-content;display:flex;align-items:center;gap:.9rem;padding:.55rem .75rem;border-radius:999px;background:rgba(6,26,59,.78);border:1px solid rgba(252,176,64,.35);backdrop-filter:blur(15px);box-shadow:0 14px 40px rgba(0,0,0,.22);z-index:30;color:#fff}.deck-title{font-weight:900;white-space:nowrap;margin:0 .4rem}.dots{display:flex;align-items:center;gap:.3rem}.dot{width:.7rem;height:.7rem;border-radius:999px;border:0;background:rgba(255,255,255,.45);cursor:pointer;padding:0}.dot.active{width:1.7rem;background:var(--gold)}.navbtn{min-width:2.4rem;height:2.4rem;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff;cursor:pointer}.counter{font-weight:800;white-space:nowrap;color:#d9e7ff}.notes-panel,.help-panel{position:fixed;left:50%;transform:translateX(-50%) translateY(110%);bottom:calc(var(--bar-h) + 28px);width:min(920px,calc(100vw - 28px));max-height:55vh;overflow:auto;background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:1.3rem;padding:1.3rem;box-shadow:var(--shadow);z-index:29;pointer-events:none;opacity:0;transition:.25s ease}.notes-panel.open,.help-panel.open{transform:translateX(-50%) translateY(0);opacity:1;pointer-events:auto}.notes-panel h3,.help-panel h3{color:var(--navy)}.help-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:.7rem}kbd{font-family:'Roboto Mono',monospace;background:#eef4ff;border:1px solid #c9d8ef;border-radius:.35rem;padding:.15rem .4rem}.presenter{display:none;position:fixed;inset:0;background:#07172f;color:#fff;z-index:50;padding:1rem;grid-template-columns:1.1fr .9fr;gap:1rem}.presenter.on{display:grid}.p-current{background:#fff;border-radius:1rem;overflow:hidden;color:var(--ink);min-height:0}.p-notes,.p-next{background:#0c2a5d;border:1px solid rgba(255,255,255,.18);border-radius:1rem;padding:1rem;overflow:auto}.timer{position:fixed;right:1rem;top:1rem;background:var(--gold);color:#061633;border-radius:999px;padding:.5rem .85rem;font-weight:900;z-index:51}.edge-left,.edge-right{position:fixed;top:0;bottom:0;width:10vw;z-index:9;pointer-events:none}.edge-left{left:0;cursor:w-resize}.edge-right{right:0;cursor:e-resize}
@media (max-width:1024px){.hero-grid,.two-col,.two-col.weighted,.statement-stat{grid-template-columns:1fr}.hero-img-wrap{max-width:720px;margin:auto}.grid-4{grid-template-columns:repeat(2,1fr)}.steps,.cards-3{grid-template-columns:1fr 1fr}}
@media (max-width:768px){.slide{align-items:flex-start;padding-top:2rem}.steps,.cards-3,.grid-4,.mini-cards{grid-template-columns:1fr}.navbar{gap:.45rem}.deck-title{display:none}.dot{width:.58rem;height:.58rem}.navbtn{min-width:2.2rem;height:2.2rem}.hero-img-wrap{transform:none}}
@media (max-width:560px){:root{--bar-h:60px}.slide{padding-inline:1rem}.counter{display:none}.chiprow span,.note-strip span{font-size:.85rem}.help-grid{grid-template-columns:1fr}}
@media (max-width:380px){.dots{gap:.18rem}.dot{width:.45rem;height:.45rem}.dot.active{width:1.15rem}.navbtn{min-width:2rem;height:2rem}}
@media (max-height:520px) and (orientation:landscape){.slide{align-items:flex-start;padding-top:1rem}h1{font-size:3rem}h2{font-size:2.2rem}.navbar{bottom:8px}}
@media (hover:none){.navbtn{min-width:2.6rem;height:2.6rem}.dot{padding:.35rem;background-clip:content-box}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

tml": "<div class=\"two-col\"><div><p class=\"eyebrow\">The practical problem</p><h2>You have the terms. You need the activity.</h2><p class=\"big\">Vocabulary review, unit warm-ups, station work, and quick checks often start with the same thing: a list.</p><p>iBINGO turns that list into a shareable classroom game without asking you to build cards by hand.</p></div><div class=\"stacked-card navy-card\"><h3>Before</h3><ul><li>Copy terms into a template</li><li>Shuffle cards manually</li><li>Print or send files</li><li>Track who has which card</li></ul><hr/><h3>With iBINGO</h3><ul><li>Paste terms</li><li>Pick a grid</li><li>Generate a link</li><li>Play</li></ul></div></div>", "notes": "This slide names the classroom problem directly. Most teachers already have the hard part done: they have the vocabulary list, review terms, or concepts from the unit. What usually slows things down is the packaging. You copy terms into a template, shuffle the cards, print versions, or send files around. iBINGO trims that down to the part that matters. Paste the list, pick the game options, and generate the share link. I would use this when I need something quick that still feels like an activity, not a worksheet in costume. Next, I show the workflow in three moves."}, {"bg": "dark", "title": "Three Moves", "html": "<div class=\"center\"><p class=\"eyebrow gold\">The workflow</p><h2>Three moves. One classroom game.</h2><div class=\"steps\"><div class=\"step\"><span>1</span><h3>Paste</h3><p>Add terms one per line, or import a file.</p></div><div class=\"step\"><span>2</span><h3>Generate</h3><p>Choose the grid size and create the cards.</p></div><div class=\"step\"><span>3</span><h3>Share</h3><p>Send one link to the whole class.</p></div></div></div>", "notes": "This slide reduces the tool to three moves: paste, generate, and share. I like this framing because it keeps the explanation from turning into a feature tour. A feature tour can be useful later, but for teachers, the first question is usually whether the tool fits into the time they actually have. It does. Students can open the same link and get the same set of terms arranged on randomized cards. That keeps preparation simple while still giving students their own card to play. Now I will slow down and show what teachers can put into the tool."}, {"bg": "light", "title": "Add Your Content", "html": "<div class=\"two-col weighted\"><div><p class=\"eyebrow\">Step 1</p><h2>Add your content</h2><p class=\"big\">Paste terms one per line, or bring in a file.</p><p>The tool cleans common formats so teachers can work from what they already have.</p></div><div class=\"browser\"><div class=\"browser-top\"><span></span><span></span><span></span><b>Terms</b></div><pre>photosynthesis\nwater cycle\nmetaphor\nprime number\ncapital of France\nchemical reaction\nfigurative language</pre></div></div><div class=\"note-strip\"><span>CSV</span><span>TXT</span><span>Markdown bullets</span><span>One term per line</span></div>", "notes": "Here, I am focusing on input. Teachers can paste terms one per line, or use a file such as CSV, TXT, or Markdown. That is more useful than it may sound, because classroom content lives in odd places: copied from a document, exported from a spreadsheet, or gathered from notes. The source page says Markdown bullets and CSV are cleaned automatically, with the first column used for CSV. That helps keep the tool forgiving. You do not need to format everything perfectly before you start. The next slide moves from the content list to the game choices."}, {"bg": "light", "title": "Choose Game Options", "html": "<div class=\"cards-3\"><div class=\"option-card\"><div class=\"icon\">3×3</div><h3>Quick check</h3><p>Nine cells for short warm-ups or younger learners.</p></div><div class=\"option-card featured\"><div class=\"icon\">4×4</div><h3>Middle ground</h3><p>Sixteen cells when you want more coverage without a long game.</p></div><div class=\"option-card\"><div class=\"icon\">5×5</div><h3>Classic BINGO</h3><p>Twenty-five cells with an optional FREE center space.</p></div></div><p class=\"under-note\">The source tool offers 3×3, 4×4, and 5×5 grids, plus an optional FREE center for 5×5 cards.</p>", "notes": "This slide shows the game options. iBINGO gives you three grid sizes: three by three, four by four, and five by five. That matters because not every class activity needs a full classic bingo card. A short vocabulary warm-up might only need nine cells. A larger review before a test might call for the full twenty-five-cell version with a FREE center space. I like that the choices are simple. You are not designing a game system. You are picking the size that matches the time and purpose. Next, I show what happens after students open the link."}, {"bg": "dark", "title": "One Link, Different Cards", "html": "<div class=\"statement-stat\"><div><p class=\"eyebrow gold\">What students get</p><h2>Same terms. Different randomized cards.</h2><p class=\"lead\">Every student opens the same share link, but each card can be arranged differently.</p></div><div class=\"stat-card\"><div class=\"stat\">1</div><p>Link for the whole class</p></div></div><div class=\"mini-cards\"><div>B<br/><small>cell</small></div><div>I<br/><small>atom</small></div><div>N<br/><small>FREE</small></div><div>G<br/><small>theme</small></div><div>O<br/><small>slope</small></div></div>", "notes": "This is one of the most important classroom details. The source page says every student who opens the link gets the same terms but a different randomized card. That is exactly what you want for a class game. Everyone works from the same content, but the cards are not identical. It also says no accounts and no server: the game lives inside the link. That kind of design is useful in schools because it lowers the setup burden. You can put the link in your LMS, project it, share it in chat, or post it where students already go. Next, I connect it to actual classroom uses."}, {"bg": "light", "title": "Where It Fits", "html": "<div class=\"center\"><p class=\"eyebrow\">Classroom uses</p><h2>Use it when repetition needs energy.</h2><div class=\"grid-4\"><div><h3>Vocabulary</h3><p>Review academic words without another worksheet.</p></div><div><h3>Unit review</h3><p>Mix key people, places, formulas, and ideas.</p></div><div><h3>Warm-ups</h3><p>Start class with a low-prep retrieval activity.</p></div><div><h3>Stations</h3><p>Give one group a quick play-and-check task.</p></div></div></div>", "notes": "This slide moves from how the tool works to where it fits. I would not save iBINGO only for special review days. It works for vocabulary, unit review, warm-ups, and stations because the setup is light. That matters. A tool that only works when you have a lot of prep time will sit unused most of the year. The best use may be retrieval practice: students have to recognize terms, listen for clues, and connect the called item to the card. The activity still feels playful, but it is tied to academic content. Next, I show a teacher-ready play pattern."}, {"bg": "light", "title": "A Simple Play Pattern", "html": "<div class=\"two-col\"><div><p class=\"eyebrow\">Try this</p><h2>Run a ten-minute round</h2><ol class=\"number-list\"><li>Paste twelve to twenty-five terms</li><li>Generate the share link</li><li>Call clues instead of reading answers</li><li>Students mark matching squares</li><li>Pause for one quick explanation</li></ol></div><div class=\"callout\"><h3>Teacher move</h3><p>Do not only call the word. Give the definition, example, image clue, or scenario. That makes students retrieve meaning, not just scan for a label.</p></div></div>", "notes": "This slide gives a simple way to use the game without overplanning it. The small teacher move here is to call clues, not just answers. If the square says “photosynthesis,” I might say, “This is the process plants use to make food from light, water, and carbon dioxide.” Then students have to retrieve the term. That turns the game into a better review activity. You can also ask students to explain why they marked a square before you keep going. That quick pause is where the learning shows up. The next slide makes the case for why this is worth using."}, {"bg": "dark", "title": "Why Teachers Will Like It", "html": "<div class=\"center\"><p class=\"eyebrow gold\">The practical case</p><h2>It respects teacher time.</h2><div class=\"cards-3 darkcards\"><div><h3>Low prep</h3><p>Use terms you already have.</p></div><div><h3>Easy sharing</h3><p>One class link handles distribution.</p></div><div><h3>Student variety</h3><p>Cards randomize without extra teacher work.</p></div></div></div>", "notes": "This slide is the practical case for iBINGO. It respects teacher time. That is not a small thing. Teachers will try almost anything once if it looks useful, but they will only keep using a tool if the setup time stays reasonable. iBINGO checks that box. It works from existing content, gives students randomized cards, and keeps sharing down to one link. That makes it a good fit for quick review, sub plans, station rotations, and those odd eight minutes at the end of class when you want something better than “start your homework.” The closing slide gives the immediate next step."}, {"bg": "hero", "title": "Ready to Play", "html": "<div class=\"closing\"><p class=\"eyebrow\">Start small</p><h2>Make your first card from tomorrow’s terms.</h2><p class=\"lead\">Pick one list. Paste it. Generate the card. Share the link. Let the class play.</p><a class=\"big-link\" href=\"https://mglearn.github.io/tcea/ibingo\" target=\"_blank\" rel=\"noopener\">Open iBINGO Game Maker</a></div>", "notes": "This final slide keeps the next step small. I would not start by building a giant review game for an entire semester. I would start with tomorrow’s terms: maybe twelve vocabulary words, ten review questions, or a quick concept list from the current lesson. Paste them in, generate the card, and share the link. After that first round, it becomes easier to see where the tool belongs in your routine. The point is not to make bingo the lesson. The point is to give students a quick, shared way to rehearse the language and ideas they need to remember."}];
let idx=0, notesOpen=false, helpOpen=false, presenter=false, audienceWin=null, start=Date.now();
const host=document.getElementById('slideHost'), dots=document.getElementById('dots'), counter=document.getElementById('counter'), progress=document.getElementById('progress');
const notesPanel=document.getElementById('notesPanel'), helpPanel=document.getElementById('helpPanel');
const bc = ('BroadcastChannel' in window) ? new BroadcastChannel('ibingo-webdeck') : null;
function renderSlides(){host.innerHTML=SLIDES.map((s,i)=>`<section class="slide ${s.bg||'light'}" data-i="${i}" aria-label="${escapeHtml(s.title)}">${s.html}</section>`).join('');dots.innerHTML=SLIDES.map((_,i)=>`<button class="dot" aria-label="Go to slide ${i+1}"></button>`).join('');[...dots.children].forEach((d,i)=>d.onclick=(e)=>{e.stopPropagation();go(i)});}
function escapeHtml(str){return String(str).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function go(n, push=true){idx=Math.max(0,Math.min(SLIDES.length-1,n));document.querySelectorAll('.slide').forEach((el,i)=>el.classList.toggle('active',i===idx));[...dots.children].forEach((d,i)=>d.classList.toggle('active',i===idx));counter.textContent=`${idx+1} / ${SLIDES.length}`;progress.style.width=`${((idx+1)/SLIDES.length)*100}%`;document.getElementById('notesTitle').textContent=SLIDES[idx].title;document.getElementById('notesText').textContent=SLIDES[idx].notes;updatePresenter(); if(push) history.replaceState(null,'',`#${idx+1}`); if(bc) bc.postMessage({type:'go',idx});}
function next(){go(idx+1)} function prev(){go(idx-1)}
function toggleNotes(){notesOpen=!notesOpen; if(helpOpen) toggleHelp(false); notesPanel.classList.toggle('open',notesOpen)}
function toggleHelp(force){helpOpen=(typeof force==='boolean')?force:!helpOpen; if(notesOpen && helpOpen) toggleNotes(); helpPanel.classList.toggle('open',helpOpen)}
function fullscreen(){if(!document.fullscreenElement) document.documentElement.requestFullscreen?.(); else document.exitFullscreen?.();}
function openPresenter(){presenter=true;document.getElementById('presenter').classList.add('on');start=Date.now(); audienceWin=window.open(location.href,'ibingo_audience','popup=yes,width=1280,height=720'); if(audienceWin) setTimeout(()=>{if(bc) bc.postMessage({type:'audience',idx})},400); updatePresenter();}
function updatePresenter(){document.getElementById('pCurrent').innerHTML=`<div style="transform:scale(.42);transform-origin:top left;width:238%;height:238%;pointer-events:none">${SLIDES[idx].html}</div>`;document.getElementById('pTitle').textContent=SLIDES[idx].title;document.getElementById('pNotes').textContent=SLIDES[idx].notes;document.getElementById('pNext').textContent=SLIDES[idx+1]?.title || 'End of deck';}
setInterval(()=>{let s=Math.floor((Date.now()-start)/1000),m=String(Math.floor(s/60)).padStart(2,'0');document.getElementById('timer').textContent=`${m}:${String(s%60).padStart(2,'0')}`},1000);
document.getElementById('next').onclick=e=>{e.stopPropagation();next()};document.getElementById('prev').onclick=e=>{e.stopPropagation();prev()};document.getElementById('notesBtn').onclick=e=>{e.stopPropagation();toggleNotes()};document.getElementById('helpBtn').onclick=e=>{e.stopPropagation();toggleHelp()};document.getElementById('fullBtn').onclick=e=>{e.stopPropagation();fullscreen()};document.getElementById('presentBtn').onclick=e=>{e.stopPropagation();openPresenter()};
document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea,select')) return; if(['ArrowRight',' ','ArrowDown'].includes(e.key)){e.preventDefault();next()} if(['ArrowLeft','ArrowUp'].includes(e.key)){e.preventDefault();prev()} if(e.key==='Home')go(0); if(e.key==='End')go(SLIDES.length-1); if(e.key.toLowerCase()==='n')toggleNotes(); if(e.key.toLowerCase()==='p')openPresenter(); if(e.key.toLowerCase()==='f')fullscreen(); if(e.key==='?')toggleHelp(); if(e.key==='Escape'){if(notesOpen)toggleNotes(); if(helpOpen)toggleHelp(false);}});
document.addEventListener('click',e=>{if(presenter||notesOpen||helpOpen) return; if(e.target.closest('a,button,.navbar,.notes-panel,.help-panel,.presenter')) return; if(String(window.getSelection())) return; const x=e.clientX/window.innerWidth; if(x<.33) prev(); else if(x>.67) next();});
let sx=0,sy=0;document.addEventListener('touchstart',e=>{sx=e.changedTouches[0].clientX; sy=e.changedTouches[0].clientY},{passive:true});document.addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy; if(Math.abs(dx)>50 && Math.abs(dx)>Math.abs(dy)) dx<0?next():prev();},{passive:true});
window.addEventListener('hashchange',()=>{const n=parseInt(location.hash.replace('#',''),10); if(n) go(n-1,false)});
if(bc) bc.onmessage=(e)=>{if(e.data?.type==='go' && e.data.idx!==idx) go(e.data.idx,false);};
renderSlides(); const initial=parseInt(location.hash.replace('#',''),10); go(initial?initial-1:0,false);
</script></body></html>
