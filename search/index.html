<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Miguel's Writings Search</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
<!-- MG-BACK-NAV v2 -->
<style id="mg-back-nav-style">
  .mg-back-bar {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 32px;
    z-index: 999999;
    background: rgba(15, 46, 34, 0.94);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border-bottom: 1px solid rgba(116, 198, 157, 0.25);
    display: flex;
    align-items: center;
    padding: 0 16px;
    font-family: 'DM Sans', system-ui, -apple-system, sans-serif;
    font-size: 12.5px;
    line-height: 1;
    box-shadow: 0 1px 6px rgba(0,0,0,0.08);
  }
  .mg-back-bar a {
    color: #B7E4C7;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-weight: 500;
    letter-spacing: 0.01em;
    transition: color 0.15s;
  }
  .mg-back-bar a:hover { color: #fff; }
  .mg-back-bar .mg-back-arrow { color: #74C69D; }
  .mg-back-bar .mg-back-sep { color: rgba(183,228,199,0.4); margin: 0 4px; }
  .mg-back-bar .mg-back-label { color: rgba(183,228,199,0.65); font-weight: 400; }
  @media print { .mg-back-bar { display: none !important; } }
</style>
<div class="mg-back-bar" role="navigation" aria-label="Back to Creations index">
  <a href="../index.html"><span class="mg-back-arrow">←</span> MGuhlin.org <span class="mg-back-sep">/</span> <span class="mg-back-label">Creations</span></a>
</div>
<script id="mg-back-nav-script">
(function() {
  var BAR_H = 32;
  var done = false;
  function offsetFixedHeaders() {
    if (done) return;
    done = true;
    var nodes = document.querySelectorAll(
      'header, nav, .topnav, .top-nav, .topbar, .navbar, .site-nav, .site-header, ' +
      '[class*="topnav"], [class*="topbar"], [class*="navbar"]'
    );
    nodes.forEach(function(el) {
      if (el.classList.contains('mg-back-bar')) return;
      var cs = window.getComputedStyle(el);
      var pos = cs.position;
      if (pos !== 'fixed' && pos !== 'sticky') return;
      var topVal = parseFloat(cs.top);
      if (isNaN(topVal) || topVal >= BAR_H) return;
      // Only shift wide, top-pinned bars (avoid moving inline-fixed widgets)
      var rect = el.getBoundingClientRect();
      if (rect.width < window.innerWidth * 0.4) return;
      el.style.setProperty('top', (topVal + BAR_H) + 'px', 'important');
    });
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', offsetFixedHeaders);
  } else {
    offsetFixedHeaders();
  }
  // Re-run once on full load in case scripts inject nav after DOMContentLoaded
  window.addEventListener('load', function() { done = false; offsetFixedHeaders(); });
})();
</script>
<main class="app-shell">
      <section class="search-panel" aria-labelledby="page-title">
        <div class="brand-row">
          <a class="site-link" href="https://mguhlin.org" target="_blank" rel="noreferrer">mguhlin.org</a>
          <span class="api-status" id="api-status">Ready</span>
        </div>

        <div class="title-row">
          <div>
            <h1 id="page-title">Search Miguel's Writings</h1>
            <p class="title-subhead">Find public posts and pages from mguhlin.org, mguhlin.blogspot.com, and Miguel's TCEA TechNotes articles.</p>
          </div>
          <img
            class="author-photo"
            src="https://blog.tcea.org/wp-content/uploads/2020/06/IMG_20200619_185656_553.jpg"
            alt="Miguel Guhlin"
          >
        </div>

        <form class="search-form" id="search-form">
          <label class="search-label" for="search-input">Search terms</label>
          <div class="search-controls">
            <input
              id="search-input"
              name="q"
              type="search"
              autocomplete="off"
              placeholder="Try AI, Google, TCEA, notebooks..."
            >
            <button type="submit">Search</button>
          </div>

          <div class="quick-searches" aria-label="Common searches">
            <span>Common searches</span>
            <div class="quick-search-list">
              <button type="button" data-search="AI" data-exact-term="AI">AI</button>
              <button type="button" data-search="ChatGPT" data-exact-term="ChatGPT">ChatGPT</button>
              <button type="button" data-search="vibe coding" data-search-variants="vibe coding|vibe coded|vibe-code|vibe code|vibecoding|vibecoded">Vibe Coding</button>
              <button type="button" data-search="NSPA">NSPA</button>
              <button type="button" data-search="Google" data-exact-term="Google">Google</button>
              <button type="button" data-search="Good Teaching" data-exact-term="Good Teaching">Good Teaching</button>
              <button type="button" data-search="Professional Learning" data-exact-term="Professional Learning">Professional Learning</button>
              <button type="button" data-search="Online Tools" data-exact-term="Online Tools">Online Tools</button>
              <button type="button" data-search="Leadership" data-exact-term="Leadership">Leadership</button>
              <button type="button" data-search="STEM" data-exact-term="STEM">STEM</button>
              <button type="button" data-search="Digital Literacy" data-exact-term="Digital Literacy">Digital Literacy</button>
              <button type="button" data-search="Coding" data-exact-term="Coding">Coding</button>
              <button type="button" data-search="Cybersecurity" data-exact-term="Cybersecurity">Cybersecurity</button>
              <button type="button" data-search="Writing" data-exact-term="Writing">Writing</button>
            </div>
          </div>

          <div class="filters" aria-label="Search filters">
            <label>
              <span>Source</span>
              <select id="source-select" name="source">
                <option value="all">All sources</option>
                <option value="mguhlin">mguhlin.org</option>
                <option value="tcea">TCEA by Miguel Guhlin</option>
                <option value="blogger">mguhlin.blogspot.com</option>
              </select>
            </label>

            <label>
              <span>Content</span>
              <select id="type-select" name="type">
                <option value="any">Posts and pages</option>
                <option value="post">Posts</option>
                <option value="page">Pages</option>
              </select>
            </label>

            <label>
              <span>Sort</span>
              <select id="sort-select" name="sort">
                <option value="relevance">Relevance</option>
                <option value="date">Newest</option>
                <option value="modified">Recently updated</option>
                <option value="title">Title</option>
              </select>
            </label>
          </div>
        </form>
      </section>

      <section class="results-panel" aria-live="polite">
        <div class="results-meta">
          <p id="results-count">Enter a search term or load recent entries.</p>
          <div class="results-actions">
            <button class="secondary-button" id="rss-button" type="button" disabled>RSS for results</button>
            <button class="secondary-button" id="recent-button" type="button">Recent entries</button>
          </div>
        </div>

        <div class="message" id="message" hidden></div>
        <div class="results-list" id="results-list"></div>

        <div class="pagination">
          <button class="secondary-button" id="prev-button" type="button" disabled>Previous</button>
          <span id="page-label">Page 1</span>
          <button class="secondary-button" id="next-button" type="button" disabled>Next</button>
        </div>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
