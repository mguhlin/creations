name: SecureVCC website consistency
on:
  push:
    branches: [main]
    paths: ['securevcc/**', '.github/workflows/securevcc.yml']
  pull_request:
    paths: ['securevcc/**', '.github/workflows/securevcc.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 securevcc/build.py --check
