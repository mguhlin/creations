<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Looney Tunes Quiz</title>
  <link rel="stylesheet" href="style.css" />
<link rel="stylesheet" href="../creations-theme.css" data-creations-theme>
</head>
<body>
<!-- MG-BACK-NAV v2 -->
<style id="mg-back-nav-style">
  .mg-back-bar {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 32px;
    z-index: 999999;
    background: rgba(15, 46, 34, 0.94);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border-bottom: 1px solid rgba(116, 198, 157, 0.25);
    display: flex;
    align-items: center;
    padding: 0 16px;
    font-family: 'DM Sans', system-ui, -apple-system, sans-serif;
    font-size: 12.5px;
    line-height: 1;
    box-shadow: 0 1px 6px rgba(0,0,0,0.08);
  }
  .mg-back-bar a {
    color: #C8D2DC;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-weight: 500;
    letter-spacing: 0.01em;
    transition: color 0.15s;
  }
  .mg-back-bar a:hover { color: #fff; }
  .mg-back-bar .mg-back-arrow { color: #C8D2DC; }
  .mg-back-bar .mg-back-sep { color: rgba(183,228,199,0.4); margin: 0 4px; }
  .mg-back-bar .mg-back-label { color: rgba(183,228,199,0.65); font-weight: 400; }
  @media print { .mg-back-bar { display: none !important; } }
</style>
<div class="mg-back-bar" role="navigation" aria-label="Back to Creations index">
  <a href="../index.html"><span class="mg-back-arrow">←</span> MGuhlin.org <span class="mg-back-sep">/</span> <span class="mg-back-label">Creations</span></a>
</div>
<script id="mg-back-nav-script">
(function() {
  var BAR_H = 32;
  var done = false;
  function offsetFixedHeaders() {
    if (done) return;
    done = true;
    var nodes = document.querySelectorAll(
      'header, nav, .topnav, .top-nav, .topbar, .navbar, .site-nav, .site-header, ' +
      '[class*="topnav"], [class*="topbar"], [class*="navbar"]'
    );
    nodes.forEach(function(el) {
      if (el.classList.contains('mg-back-bar')) return;
      var cs = window.getComputedStyle(el);
      var pos = cs.position;
      if (pos !== 'fixed' && pos !== 'sticky') return;
      var topVal = parseFloat(cs.top);
      if (isNaN(topVal) || topVal >= BAR_H) return;
      // Only shift wide, top-pinned bars (avoid moving inline-fixed widgets)
      var rect = el.getBoundingClientRect();
      if (rect.width < window.innerWidth * 0.4) return;
      el.style.setProperty('top', (topVal + BAR_H) + 'px', 'important');
    });
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', offsetFixedHeaders);
  } else {
    offsetFixedHeaders();
  }
  // Re-run once on full load in case scripts inject nav after DOMContentLoaded
  window.addEventListener('load', function() { done = false; offsetFixedHeaders(); });
})();
</script>
<div id="quiz-container">
    <h1>Looney Tunes Educator Quiz</h1>
    <select onchange="location = this.value;">
      <option disabled selected>Choose a quiz</option>
      <option value='index.html'>Winnie the Pooh</option>
      <option value='smurfs.html'>The Smurfs</option>
      <option value='dwarfs.html'>Snow White</option>
      <option value='looney.html'>Looney Tunes</option>
    </select>
    <div id="question-box"></div>
    <button id="next-btn" onclick="nextQuestion()">Next</button>
    <div id="result-box"></div>
  </div>
  <script src="script.js"></script>
  <script src="data/looney-questions.js"></script>
</body>
</html>
