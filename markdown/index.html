:root {
  --navy:        #0A3476;
  --navy-dark:   #071f4a;
  --navy-mid:    #12428f;
  --gold:        #FCB040;
  --gold-light:  #fdd17a;
  --gold-pale:   #FEF0D0;
  --pale-navy:   #D0D8F0;
  --white:       #ffffff;
  --off-white:   #f7f8fc;
  --text:        #1a1a2e;
  --text-muted:  #5a6680;
  --border:      #e2e7f5;
  --teal:        #0e6b8a;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: 'DM Sans', sans-serif;
  font-weight: 400;
  background: var(--off-white);
  color: var(--text);
  line-height: 1.6;
  min-height: 100vh;
}
main, header, footer { position: relative; z-index: 1; }

/* ---------- Topnav ---------- */
.topnav {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 200;
  height: 56px;
  background: rgba(255,255,255,0.95);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 24px;
  gap: 16px;
}
.topnav-brand {
  font-family: 'DM Serif Display', serif;
  font-weight: 400;
  font-size: 1.15rem;
  color: var(--navy);
  text-decoration: none;
  letter-spacing: 0.01em;
}
.topnav-brand em {
  color: var(--gold);
  font-style: italic;
}
.topnav-spacer { flex: 1; }
.topnav-link {
  font-family: 'DM Sans', sans-serif;
  font-size: 0.78rem;
  font-weight: 600;
  letter-spacing: 0.04em;
  color: var(--navy);
  text-decoration: none;
  padding: 7px 14px;
  border: 1.5px solid var(--border);
  border-radius: 8px;
  transition: background 0.18s, border-color 0.18s, color 0.18s;
}
.topnav-link:hover { background: var(--pale-navy); border-color: var(--navy); }

/* ---------- Hero ---------- */
.hero {
  padding: 96px 24px 36px;
  position: relative;
  background:
    radial-gradient(ellipse 70% 60% at 50% 30%, rgba(252,176,64,0.12) 0%, transparent 65%),
    linear-gradient(180deg, var(--navy-dark) 0%, var(--navy) 100%);
  overflow: hidden;
  color: var(--white);
}
.hero::after {
  content: '';
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
  background-size: 56px 56px;
